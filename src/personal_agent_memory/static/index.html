<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Agent Memory · mem2</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fb; --panel:#fff; --text:#18212f; --muted:#657083; --line:#d9dfeb; --accent:#275fce; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 28px; background:#12233f; color:#fff; }
    header h1 { margin:0; font-size:20px; }
    main { max-width:1280px; margin:0 auto; padding:24px; display:grid; gap:18px; }
    .grid { display:grid; grid-template-columns:minmax(260px,0.8fr) minmax(0,2fr); gap:18px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
    h2 { margin:0 0 12px; font-size:16px; }
    h3 { margin:18px 0 8px; font-size:14px; color:var(--muted); }
    label { display:block; margin:10px 0 4px; color:var(--muted); font-size:13px; }
    input, select, textarea, button { font:inherit; }
    input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
    textarea { min-height:220px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; }
    button.secondary { background:transparent; color:var(--accent); }
    button.danger { border-color:var(--danger); background:var(--danger); }
    button:disabled { opacity:.55; cursor:wait; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .row { display:flex; gap:8px; align-items:center; }
    .row > * { flex:1; }
    .muted { color:var(--muted); }
    .notice { min-height:24px; padding:8px 10px; border-radius:8px; background:var(--bg); white-space:pre-wrap; }
    .notice.error { color:var(--danger); }
    .region-list, .document-list, .history-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; max-height:360px; overflow:auto; }
    .region-list button, .document-list button, .history-list button { width:100%; text-align:left; background:transparent; color:inherit; border:1px solid var(--line); }
    .region-list button.active { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); }
    .result { border-top:1px solid var(--line); padding:12px 0; }
    .result:first-child { border-top:0; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bg); padding:12px; border-radius:8px; }
    .hidden { display:none !important; }
    @media (max-width: 840px) { .grid { grid-template-columns:1fr; } header { padding:16px; } main { padding:14px; } }
  </style>
</head>
<body>
<header>
  <h1>Personal Agent Memory</h1>
  <div id="status" class="muted">正在连接 mem2…</div>
</header>
<main>
  <section id="login-panel">
    <h2>登录管理台</h2>
    <p class="muted">使用本地守护进程的 API key。登录会创建同源、HttpOnly 管理会话 Cookie。</p>
    <form id="login-form">
      <label for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="current-password" required>
      <div class="actions"><button type="submit">登录</button></div>
    </form>
    <p id="login-message" class="notice" aria-live="polite"></p>
  </section>

  <div id="workspace" class="grid hidden">
    <div>
      <section>
        <h2>记忆区域</h2>
        <p class="muted">用户、专题、项目和会话区域共享同一个 mem2.0 存储。</p>
        <ul id="region-list" class="region-list"></ul>
        <h3>创建区域</h3>
        <form id="region-form">
          <label for="region-kind">类型</label>
          <select id="region-kind"><option value="topic">专题</option><option value="project">项目</option></select>
          <label for="region-name">名称</label>
          <input id="region-name" required maxlength="200">
          <label for="region-id">区域 ID（可选）</label>
          <input id="region-id" maxlength="120" placeholder="自动生成">
          <div class="actions"><button type="submit">创建区域</button></div>
        </form>
        <h3>绑定项目</h3>
        <form id="binding-form">
          <label for="binding-root">项目根目录</label>
          <input id="binding-root" required placeholder="/path/to/project">
          <label for="binding-region">项目区域</label>
          <select id="binding-region"></select>
          <div class="actions"><button type="submit">绑定</button></div>
        </form>
      </section>
      <section style="margin-top:18px">
        <h2>自动晋升</h2>
        <p class="muted">对选中区域运行多目标晋升。敏感、冲突和证据不足的内容不会晋升。</p>
        <div class="actions"><button id="promotion-button" type="button">运行晋升</button></div>
        <p id="promotion-message" class="notice" aria-live="polite"></p>
      </section>
    </div>

    <div>
      <section>
        <h2>检索</h2>
        <form id="search-form">
          <label for="search-query">查询</label>
          <input id="search-query" required placeholder="当前项目决策、偏好、领域事实…">
          <div class="actions"><button type="submit">检索选中区域</button></div>
        </form>
        <p id="search-message" class="notice" aria-live="polite"></p>
        <div id="search-results"></div>
      </section>

      <section style="margin-top:18px">
        <h2>记忆单元</h2>
        <ul id="document-list" class="document-list"></ul>
        <label for="document-content">内容</label>
        <textarea id="document-content" spellcheck="false"></textarea>
        <div class="actions">
          <button id="save-document" type="button">保存更正</button>
          <button id="delete-document" class="danger" type="button">遗忘记忆</button>
          <button id="load-history" class="secondary" type="button">查看审计</button>
        </div>
        <p id="document-message" class="notice" aria-live="polite"></p>
        <ul id="history-list" class="history-list"></ul>
      </section>
    </div>
  </div>
</main>
<script>
(() => {
  const state = { regions: [], selectedRegion: null, selectedPath: null, sourceVersion: null };
  const $ = (id) => document.getElementById(id);
  const setMessage = (element, text, error = false) => {
    element.textContent = text;
    element.classList.toggle('error', error);
  };
  async function request(url, options = {}) {
    const response = await fetch(url, { credentials: 'same-origin', ...options });
    if (response.status === 401) {
      showLogin();
      throw new Error('认证已失效，请重新登录。');
    }
    if (!response.ok) {
      let detail = `${response.status} ${response.statusText}`;
      try { const body = await response.json(); if (body.detail) detail = body.detail; } catch {}
      throw new Error(detail);
    }
    if (response.status === 204) return null;
    const type = response.headers.get('content-type') || '';
    return type.includes('application/json') ? response.json() : response.text();
  }
  function showLogin() {
    $('login-panel').classList.remove('hidden');
    $('workspace').classList.add('hidden');
  }
  function showWorkspace() {
    $('login-panel').classList.add('hidden');
    $('workspace').classList.remove('hidden');
  }
  function regionLabel(region) { return `${region.name} · ${region.kind} · ${region.region_id}`; }
  function renderRegions() {
    const list = $('region-list');
    list.replaceChildren();
    const bindingSelect = $('binding-region');
    bindingSelect.replaceChildren();
    for (const region of state.regions.filter((item) => item.kind === 'project')) {
      const option = document.createElement('option');
      option.value = region.region_id;
      option.textContent = regionLabel(region);
      bindingSelect.append(option);
    }
    for (const region of state.regions) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = regionLabel(region);
      button.classList.toggle('active', state.selectedRegion === region.region_id);
      button.addEventListener('click', () => selectRegion(region.region_id));
      item.append(button);
      list.append(item);
    }
  }
  async function loadRegions() {
    state.regions = await request('/api/v1/regions');
    if (!state.selectedRegion && state.regions.length) state.selectedRegion = state.regions[0].region_id;
    renderRegions();
  }
  async function loadStatus() {
    const status = await request('/api/v1/status');
    $('status').textContent = `${status.memory_kernel} · ${status.memory_kernel_status}`;
    showWorkspace();
  }
  async function selectRegion(regionId) {
    state.selectedRegion = regionId;
    state.selectedPath = null;
    state.sourceVersion = null;
    renderRegions();
    await loadDocuments();
  }
  async function loadDocuments() {
    const list = $('document-list');
    list.replaceChildren();
    $('document-content').value = '';
    setMessage($('document-message'), '');
    if (!state.selectedRegion) return;
    const documents = await request(`/api/v1/libraries/${encodeURIComponent(state.selectedRegion)}/documents`);
    for (const document of documents) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = String(document.path);
      button.addEventListener('click', () => loadDocument(String(document.path)));
      item.append(button);
      list.append(item);
    }
    setMessage($('document-message'), documents.length ? '选择一条记忆单元进行检视。' : '当前区域没有记忆单元。');
  }
  async function loadDocument(path) {
    state.selectedPath = path;
    const document = await request(`/api/v1/libraries/${encodeURIComponent(state.selectedRegion)}/document?path=${encodeURIComponent(path)}`);
    state.sourceVersion = String(document.source_version);
    $('document-content').value = String(document.content);
    $('history-list').replaceChildren();
    setMessage($('document-message'), `已加载 ${path}，来源版本 ${state.sourceVersion}。`);
  }
  async function saveDocument() {
    if (!state.selectedRegion || !state.selectedPath) return;
    const button = $('save-document');
    button.disabled = true;
    try {
      const updated = await request(`/api/v1/libraries/${encodeURIComponent(state.selectedRegion)}/document`, {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          path: state.selectedPath,
          content: $('document-content').value,
          expected_source_version: state.sourceVersion,
          operation_id: crypto.randomUUID(),
          actor_type: 'user',
          source: 'web',
        }),
      });
      state.sourceVersion = String(updated.source_version);
      setMessage($('document-message'), '更正已保存并写入持久化审计。');
      await loadDocuments();
    } catch (error) {
      setMessage($('document-message'), error.message, true);
    } finally { button.disabled = false; }
  }
  async function deleteDocument() {
    if (!state.selectedRegion || !state.selectedPath) return;
    const button = $('delete-document');
    button.disabled = true;
    try {
      const preview = await request(`/api/v1/libraries/${encodeURIComponent(state.selectedRegion)}/document/delete-preview`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ path: state.selectedPath, expected_source_version: state.sourceVersion, operation_id: crypto.randomUUID() }),
      });
      await request(`/api/v1/libraries/${encodeURIComponent(state.selectedRegion)}/document`, {
        method: 'DELETE',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          path: state.selectedPath,
          expected_source_version: state.sourceVersion,
          preview_token: preview.preview_token,
          operation_id: crypto.randomUUID(),
          actor_type: 'user',
          source: 'web-delete',
          mode: 'forget',
        }),
      });
      setMessage($('document-message'), '记忆已遗忘，可在审计记录中核对。');
      await loadDocuments();
    } catch (error) {
      setMessage($('document-message'), error.message, true);
    } finally { button.disabled = false; }
  }
  async function loadHistory() {
    if (!state.selectedRegion) return;
    const history = await request(`/api/v1/libraries/${encodeURIComponent(state.selectedRegion)}/history?limit=50`);
    const list = $('history-list');
    list.replaceChildren();
    for (const entry of history) {
      const item = document.createElement('li');
      item.textContent = `${entry.occurred_at || entry.authored_at || ''} · ${entry.action} · ${entry.target_id || entry.subject || ''}`;
      list.append(item);
    }
    setMessage($('document-message'), history.length ? '已加载持久化审计记录。' : '当前区域没有审计记录。');
  }
  async function runSearch(event) {
    event.preventDefault();
    if (!state.selectedRegion) return;
    setMessage($('search-message'), '正在检索…');
    const packageValue = await request('/api/v1/search', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ region_id: state.selectedRegion, query: $('search-query').value, token_budget: 10000 }),
    });
    const container = $('search-results');
    container.replaceChildren();
    for (const result of packageValue.results || []) {
      const article = document.createElement('article');
      article.className = 'result';
      const heading = document.createElement('strong');
      heading.textContent = `${result.path} · ${result.source_type} · ${result.source_version}`;
      const content = document.createElement('p');
      content.textContent = result.content;
      article.append(heading, content);
      container.append(article);
    }
    const budget = packageValue.budget || {};
    setMessage($('search-message'), `${(packageValue.results || []).length} 条结果，使用 ${budget.used_tokens ?? 0}/${budget.effective_tokens ?? 10000} token。`);
  }
  async function createRegion(event) {
    event.preventDefault();
    try {
      const body = { kind: $('region-kind').value, name: $('region-name').value };
      if ($('region-id').value.trim()) body.region_id = $('region-id').value.trim();
      const region = await request('/api/v1/regions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      state.selectedRegion = region.region_id;
      $('region-form').reset();
      await loadRegions();
      await loadDocuments();
    } catch (error) { setMessage($('status'), error.message, true); }
  }
  async function bindProject(event) {
    event.preventDefault();
    try {
      await request('/api/v1/project-bindings', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ project_root: $('binding-root').value, region_id: $('binding-region').value }),
      });
      setMessage($('document-message'), '项目绑定已保存。');
    } catch (error) { setMessage($('document-message'), error.message, true); }
  }
  async function runPromotion() {
    if (!state.selectedRegion) return;
    const button = $('promotion-button');
    button.disabled = true;
    try {
      const job = await request('/api/v1/promotions', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ source_region_ids: [state.selectedRegion] }),
      });
      setMessage($('promotion-message'), `晋升任务已排队：${job.job_id}`);
    } catch (error) { setMessage($('promotion-message'), error.message, true); }
    finally { button.disabled = false; }
  }
  $('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    try {
      await request('/api/v1/auth/login', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ api_key: $('api-key').value }),
      });
      $('login-form').reset();
      await loadStatus();
      await loadRegions();
      await loadDocuments();
    } catch (error) { setMessage($('login-message'), error.message, true); }
  });
  $('search-form').addEventListener('submit', (event) => runSearch(event).catch((error) => setMessage($('search-message'), error.message, true)));
  $('region-form').addEventListener('submit', createRegion);
  $('binding-form').addEventListener('submit', bindProject);
  $('save-document').addEventListener('click', saveDocument);
  $('delete-document').addEventListener('click', deleteDocument);
  $('load-history').addEventListener('click', () => loadHistory().catch((error) => setMessage($('document-message'), error.message, true)));
  $('promotion-button').addEventListener('click', runPromotion);
  loadStatus().then(async () => { await loadRegions(); await loadDocuments(); }).catch(() => showLogin());
})();
</script>
</body>
</html>
