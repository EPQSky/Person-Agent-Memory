        });
        candidateStatus.addEventListener('change', () => { ++candidateSelectionGeneration; refreshCandidates(); });
        candidateDetail.querySelector('#candidate-pin').addEventListener('click', pinCandidate);
        retentionForm.querySelector('#retention-library').addEventListener('change', () => { ++retentionSelectionGeneration; refreshRetention(); });
        for (const control of retentionForm.querySelectorAll('input')) control.addEventListener('input', invalidateRetentionPreview);
        retentionForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const button = retentionForm.querySelector('button[type="submit"]');
          const libraryId = retentionForm.querySelector('#retention-library').value;
          const generation = generations.retention;
          invalidateRetentionPreview();
          await performOnce(`retention-policy-${libraryId}`, button, '正在保存...', async () => {
          const payload = {
            inbox_days: Number(retentionForm.querySelector('#inbox-days').value),
            candidate_days: Number(retentionForm.querySelector('#candidate-days').value),
            recycle_days: Number(retentionForm.querySelector('#recycle-days').value),
            early_inbox_cleanup: retentionForm.querySelector('#early-inbox-cleanup').checked,
            diagnostics_enabled: retentionForm.querySelector('#diagnostics-enabled').checked,
            diagnostic_days: Number(retentionForm.querySelector('#diagnostic-days').value),
          };
          const response = await request(`/api/v1/libraries/${libraryId}/retention-policy`, {method: 'PUT', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
          if (generation !== generations.retention || libraryId !== retentionForm.querySelector('#retention-library').value) return;
          setMessage(retentionForm.querySelector('#retention-message'), response.ok ? '保留策略已保存。' : '保留策略保存失败。', response.ok ? 'success' : 'error');
          if (response.ok) await previewRetention();
          });
        });
        retentionForm.querySelector('#retention-preview').addEventListener('click', async (event) => {
          const libraryId = retentionForm.querySelector('#retention-library').value;
          await performOnce(`retention-preview-${libraryId}`, event.currentTarget, '正在预览...', previewRetention, retentionForm.querySelector('#retention-message'));
        });
        retentionForm.querySelector('#retention-run').addEventListener('click', runRetentionCleanup);
        retentionForm.querySelector('#diagnostics-clear').addEventListener('click', async () => {
          if (!await confirmAction('确认清除诊断', '将删除当前保留的诊断数据。')) return;
          const button = retentionForm.querySelector('#diagnostics-clear');
          await performOnce('diagnostics-clear', button, '正在清除...', async () => {
            const response = await request('/api/v1/diagnostics', {method: 'DELETE', headers: {Authorization: `Bearer ${key}`}});
            setMessage(retentionForm.querySelector('#retention-message'), response.ok ? '诊断数据已清除。' : '诊断数据清除失败。', response.ok ? 'success' : 'error');
          });
        });
        candidateDetail.querySelector('#candidate-save').addEventListener('click', () => candidateAction('edit'));
        candidateDetail.querySelector('#candidate-approve').addEventListener('click', () => candidateAction('approve'));
        candidateDetail.querySelector('#candidate-resolve').addEventListener('click', resolveCandidate);
        candidateDetail.querySelector('#candidate-reject').addEventListener('click', () => candidateAction('reject'));
        sensitiveDetail.querySelector('#sensitive-acknowledge').addEventListener('click', () => resolveSensitiveRecord('acknowledge'));
        sensitiveDetail.querySelector('#sensitive-discard').addEventListener('click', () => resolveSensitiveRecord('discard'));
        sensitivePagination.querySelector('#sensitive-previous').addEventListener('click', () => { sensitiveOffset = Math.max(0, sensitiveOffset - sensitivePageSize); refreshSensitiveQuarantine(); });
        sensitivePagination.querySelector('#sensitive-next').addEventListener('click', () => { sensitiveOffset += sensitivePageSize; refreshSensitiveQuarantine(); });
        sensitivePagination.querySelector('#sensitive-refresh').addEventListener('click', () => refreshSensitiveQuarantine());
        editorLibrary.addEventListener('change', async () => { historyLibrary.value = editorLibrary.value; await refreshDocuments(); });
        reconciliationDetail.querySelector('#reconciliation-import').addEventListener('click', () => resolveReconciliation('import'));
        reconciliationDetail.querySelector('#reconciliation-restore').addEventListener('click', () => resolveReconciliation('restore'));
        reconciliationDetail.querySelector('#reconciliation-final').addEventListener('input', (event) => {
          const candidatePaths = activeReconciliation?.external_candidates || [];
          reconciliationDetail.querySelector('#reconciliation-import').disabled =
            (activeReconciliation?.external_withheld && !event.target.value.trim())
            || (candidatePaths.length > 1 && !reconciliationDetail.querySelector('#reconciliation-path').value);
        });
        reconciliationDetail.querySelector('#reconciliation-path').addEventListener('change', (event) => {
          reconciliationDetail.querySelector('#reconciliation-import').disabled =
            !event.target.value
            || (activeReconciliation?.external_withheld && !reconciliationDetail.querySelector('#reconciliation-final').value.trim());
          reconciliationDetail.querySelector('#reconciliation-restore').disabled = !event.target.value;
        });
        editor.querySelector('#source-tab').addEventListener('click', () => showEditorPanel('source'));
        editor.querySelector('#preview-tab').addEventListener('click', () => previewChange(editorContext.snapshot(), 'preview'));
        editor.querySelector('#diff-tab').addEventListener('click', () => previewChange());
        const editorTabs = [...editor.querySelectorAll('[role="tab"]')];
        for (const [index, tab] of editorTabs.entries()) {
          tab.tabIndex = index === 0 ? 0 : -1;
          tab.addEventListener('keydown', (event) => {
            if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
            event.preventDefault();
            const targetIndex = event.key === 'Home' ? 0 : event.key === 'End' ? editorTabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + editorTabs.length) % editorTabs.length;
            editorTabs[targetIndex].focus();
            editorTabs[targetIndex].click();
          });
        }
        editor.querySelector('#preview-change').addEventListener('click', () => previewChange());
        editor.querySelector('#preview-delete').addEventListener('click', previewForgetting);
        editor.querySelector('#confirm-delete').addEventListener('click', forgetDocument);
        editor.querySelector('#document-source').addEventListener('input', () => {
          editorContext.edit(editor.querySelector('#document-source').value);
          restoreAction.replaceChildren();
          historySelection.clear();
          deletionPreviewVersion = null;
          deletionPreviewToken = null;
          editor.querySelector('#confirm-delete').disabled = true;
        });
        forgottenForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const libraryId = editorLibrary.value;
          const tombstone = forgottenForm.querySelector('#forgotten-memory');
          const commit = forgottenForm.querySelector('#forgotten-commit');
          const tombstoneId = tombstone.value;
          const selectedCommit = commit.value;
          const restoreGeneration = generations.forgotten;
          const restoreContextIsCurrent = () => editorLibrary.value === libraryId
            && generations.forgotten === restoreGeneration
            && tombstone.dataset.libraryId === libraryId
            && Number(tombstone.dataset.generation) === restoreGeneration
            && commit.dataset.libraryId === libraryId
            && Number(commit.dataset.generation) === restoreGeneration
            && tombstone.value === tombstoneId
            && commit.value === selectedCommit;
          if (!tombstoneId || !selectedCommit || !restoreContextIsCurrent()) return;
          if (!await confirmAction('确认恢复遗忘记忆', `将恢复 ${tombstone.options[tombstone.selectedIndex].textContent}，并创建新的记忆变更事务。`)) return;
          if (!restoreContextIsCurrent()) return;
          const button = forgottenForm.querySelector('button[type="submit"]');
          await performOnce('forgotten-restore', button, '正在恢复...', async () => {
          if (!restoreContextIsCurrent()) return;
          const response = await request(`/api/v1/libraries/${libraryId}/forgotten/restore`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({tombstone_id: tombstoneId, commit: selectedCommit, operation_id: crypto.randomUUID(), actor_type: 'user', source: 'web-forgotten-history'})});
          const message = forgottenForm.querySelector('#forgotten-message');
          if (!restoreContextIsCurrent()) return;
          if (!response.ok) { const failure = await response.json(); if (restoreContextIsCurrent()) setMessage(message, describeError(failure, '遗忘记忆恢复失败'), 'error'); return; }
          const expectedRefreshGeneration = restoreGeneration + 2;
          await refreshDocuments();
          const currentContext = editorContext.snapshot();
          if (editorLibrary.value === libraryId
              && generations.forgotten === expectedRefreshGeneration
              && tombstone.dataset.libraryId === libraryId
              && Number(tombstone.dataset.generation) === expectedRefreshGeneration
              && commit.dataset.libraryId === libraryId
              && Number(commit.dataset.generation) === expectedRefreshGeneration
              && currentContext?.libraryId === libraryId
              && !currentContext.path) setMessage(message, '遗忘记忆已通过新事务恢复。', 'success');
          }, null, restoreContextIsCurrent);
        });
        editor.querySelector('#save-change').addEventListener('click', saveDocument);
        await refresh();
      });
    </script>
  </body>
</html>
