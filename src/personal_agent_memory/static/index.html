<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Agent Memory</title>
    <style>
      :root { color: #17211b; background: #f4f6f5; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; }
      header { background: #143d2b; color: white; padding: 18px 28px; }
      h1 { font-size: 20px; margin: 0; letter-spacing: 0; }
      main { max-width: 920px; margin: 48px auto; padding: 0 24px; }
      section { border: 1px solid #ccd5cf; background: white; border-radius: 8px; padding: 24px; }
      section + section { margin-top: 20px; }
      label { display: block; font-weight: 650; margin-bottom: 8px; }
      input, select, textarea { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #8d9b92; }
      input[type="checkbox"] { width: auto; }
      button { margin-top: 12px; padding: 10px 16px; border: 0; background: #176943; color: white; cursor: pointer; }
      button.danger { background: #9d241d; margin: 0; }
      dl { display: grid; grid-template-columns: 180px 1fr; gap: 8px; }
      dt { color: #526158; } dd { margin: 0; font-family: monospace; }
      .error { color: #9d241d; }
      .field { margin-top: 14px; }
      table { width: 100%; border-collapse: collapse; margin-top: 18px; }
      th, td { padding: 10px 8px; border-bottom: 1px solid #dbe2de; text-align: left; vertical-align: top; }
      th { color: #526158; font-size: 13px; text-transform: uppercase; }
      td.path { overflow-wrap: anywhere; }
      .search-result { border-top: 1px solid #dbe2de; padding: 14px 0; }
      .search-result pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      .source { color: #526158; font: 13px/1.4 monospace; }
      .editor-layout { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 3fr); gap: 18px; }
      .document-tree, .history { max-height: 520px; overflow: auto; border-right: 1px solid #dbe2de; padding-right: 12px; }
      .document-tree button, .history button { display: block; width: 100%; margin: 0 0 6px; text-align: left; overflow-wrap: anywhere; }
      textarea { min-height: 480px; resize: vertical; font: 14px/1.5 monospace; white-space: pre; overflow: auto; }
      iframe { width: 100%; min-height: 480px; border: 1px solid #ccd5cf; background: white; }
      .editor-tabs { display: flex; gap: 8px; margin: 12px 0; }
      .editor-tabs button { margin: 0; }
      .diff { max-height: 420px; overflow: auto; white-space: pre; font: 13px/1.5 monospace; background: #f4f6f5; padding: 12px; }
      .candidate-layout { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 18px; }
      .candidate-list { max-height: 420px; overflow: auto; border-right: 1px solid #dbe2de; padding-right: 12px; }
      .candidate-list button { display: block; width: 100%; margin: 0 0 6px; text-align: left; overflow-wrap: anywhere; }
      .candidate-actions { display: flex; gap: 8px; }
      .candidate-actions button { flex: 0 0 auto; }
      @media (max-width: 720px) { main { margin: 20px auto; } .editor-layout, .candidate-layout { grid-template-columns: 1fr; } .document-tree, .history, .candidate-list { border-right: 0; max-height: 220px; } }
    </style>
  </head>
  <body>
    <header><h1>Personal Agent Memory</h1></header>
    <main><section id="root"><label for="key">API key</label><input id="key" type="password" autocomplete="off"><button id="connect">Connect</button><p id="message">Enter the key stored in your platform state directory.</p></section></main>
    <script src="/editor-history.js"></script>
    <script>
      const root = document.querySelector('#root');
      document.querySelector('#connect').addEventListener('click', async () => {
        const key = document.querySelector('#key').value;
        const response = await fetch('/api/v1/status', {headers: {Authorization: `Bearer ${key}`}});
        if (!response.ok) { document.querySelector('#message').className = 'error'; document.querySelector('#message').textContent = 'Authentication failed.'; return; }
        const data = await response.json();
        root.replaceChildren();
        const statusHeading = document.createElement('h2');
        statusHeading.textContent = 'Service ready';
        const statusList = document.createElement('dl');
        for (const [label, value] of [['Database', data.database], ['Background worker', data.background_worker], ['API key fingerprint', data.api_key_fingerprint], ['Startup count', data.startup_count]]) {
          const term = document.createElement('dt');
          const detail = document.createElement('dd');
          term.textContent = label;
          detail.textContent = value;
          statusList.append(term, detail);
        }
        const heading = document.createElement('h2');
        heading.textContent = 'Memory libraries';
        const form = document.createElement('form');
        form.innerHTML = '<div class="field"><label for="path">Directory path</label><input id="path" required></div><div class="field"><label for="kind">Library type</label><select id="kind"><option value="project">Project</option><option value="user">User</option></select></div><div class="field"><label><input id="reuse-existing-git" type="checkbox"> Authorize this dedicated memory repository</label></div><button type="submit">Register library</button><p id="library-message"></p>';
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Identifier</th><th>Type</th><th>Path</th><th>Availability</th><th>Text</th><th>Graph</th><th>Graph progress</th><th>Graph error</th></tr></thead><tbody></tbody>';
        const bindingHeading = document.createElement('h2');
        bindingHeading.textContent = 'Project bindings';
        const bindingForm = document.createElement('form');
        bindingForm.innerHTML = '<div class="field"><label for="project-root">Project root</label><input id="project-root" required></div><div class="field"><label for="project-library">Project memory library</label><select id="project-library" required></select></div><button type="submit">Bind project</button><p id="binding-message"></p>';
        const worktreeForm = document.createElement('form');
        worktreeForm.innerHTML = '<div class="field"><label for="worktree-root">Worktree root</label><input id="worktree-root" required></div><div class="field"><label for="main-binding">Main project</label><select id="main-binding" required></select></div><button type="submit">Associate worktree</button><p id="worktree-message"></p>';
        const bindingTable = document.createElement('table');
        bindingTable.innerHTML = '<thead><tr><th>Project</th><th>Kind</th><th>Root</th><th>Library</th><th>Availability</th><th>Actions</th></tr></thead><tbody></tbody>';
        const searchHeading = document.createElement('h2');
        searchHeading.textContent = 'Search project memory';
        const searchForm = document.createElement('form');
        searchForm.innerHTML = '<div class="field"><label for="search-cwd">Project working directory</label><input id="search-cwd" required></div><div class="field"><label for="search-query">Keywords</label><input id="search-query" required></div><button type="submit">Search</button><p id="search-message"></p><div id="search-results"></div>';
        const candidateHeading = document.createElement('h2');
        candidateHeading.textContent = 'Candidate memories';
        const candidateStatus = document.createElement('select');
        candidateStatus.setAttribute('aria-label', 'Candidate status');
        candidateStatus.innerHTML = '<option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option>';
        const candidateLayout = document.createElement('div');
        candidateLayout.className = 'candidate-layout';
        const candidateList = document.createElement('nav');
        candidateList.className = 'candidate-list';
        const candidateDetail = document.createElement('div');
        candidateDetail.innerHTML = '<strong id="candidate-title">Select a candidate</strong><p id="candidate-sources" class="source"></p><p id="candidate-governance" class="source"></p><pre id="candidate-current" class="diff" hidden></pre><pre id="candidate-conflict-diff" class="diff" hidden></pre><textarea id="candidate-body" spellcheck="false" disabled></textarea><div class="field"><label for="candidate-operator">Operator</label><input id="candidate-operator" disabled></div><div class="field"><label for="candidate-reason">Reason</label><input id="candidate-reason" disabled></div><div class="field"><label for="candidate-resolution">Resolution</label><select id="candidate-resolution" disabled><option value="keep">Keep current</option><option value="adopt">Adopt candidate</option><option value="merge">Merge as new version</option><option value="scope">Different conditions</option></select></div><div class="field"><label for="candidate-effective">Effective at</label><input id="candidate-effective" type="datetime-local" disabled></div><div class="field"><label for="candidate-condition">Condition</label><input id="candidate-condition" disabled></div><div class="candidate-actions"><button type="button" id="candidate-save" disabled>Save</button><button type="button" id="candidate-approve" disabled>Approve</button><button type="button" id="candidate-resolve" disabled>Resolve</button><button type="button" id="candidate-reject" class="danger" disabled>Reject</button></div><p id="candidate-message"></p>';
        candidateLayout.append(candidateList, candidateDetail);
        const sensitiveHeading = document.createElement('h2');
        sensitiveHeading.textContent = 'Sensitive quarantine';
        const sensitiveLayout = document.createElement('div');
        sensitiveLayout.className = 'candidate-layout';
        const sensitiveList = document.createElement('nav');
        sensitiveList.id = 'sensitive-quarantine-list';
        sensitiveList.className = 'candidate-list';
        const sensitivePagination = document.createElement('div');
        sensitivePagination.className = 'candidate-actions';
        sensitivePagination.innerHTML = '<button type="button" id="sensitive-previous">Previous</button><span id="sensitive-page"></span><button type="button" id="sensitive-next">Next</button><button type="button" id="sensitive-refresh">Refresh</button>';
        sensitiveList.append(sensitivePagination);
        const sensitiveDetail = document.createElement('div');
        sensitiveDetail.id = 'sensitive-quarantine-detail';
        sensitiveDetail.innerHTML = '<strong id="sensitive-title">Select a quarantine record</strong><p id="sensitive-summary"></p><p id="sensitive-metadata" class="source"></p><div class="candidate-actions"><button type="button" id="sensitive-acknowledge" disabled>Acknowledge</button><button type="button" id="sensitive-discard" class="danger" disabled>Discard</button></div><p id="sensitive-message"></p>';
        sensitiveLayout.append(sensitiveList, sensitiveDetail);
        const editorHeading = document.createElement('h2');
        editorHeading.textContent = 'Memory documents';
        const editorLibrary = document.createElement('select');
        editorLibrary.setAttribute('aria-label', 'Memory library to edit');
        const editorLayout = document.createElement('div');
        editorLayout.className = 'editor-layout';
        const documentTree = document.createElement('nav');
        documentTree.className = 'document-tree';
        const editor = document.createElement('div');
        editor.innerHTML = '<strong id="document-path">Select a document</strong><div class="editor-tabs"><button type="button" id="source-tab">Source</button><button type="button" id="preview-tab">Preview</button><button type="button" id="diff-tab">Diff</button></div><textarea id="document-source" spellcheck="false" disabled></textarea><iframe id="document-preview" sandbox hidden title="Rendered Markdown preview"></iframe><pre id="document-diff" class="diff" hidden></pre><button type="button" id="preview-change" disabled>Preview changes</button><button type="button" id="save-change" disabled>Save</button><button type="button" id="preview-delete" class="danger" disabled>Preview forgetting</button><button type="button" id="confirm-delete" class="danger" disabled>Forget</button><p id="editor-message"></p>';
        editorLayout.append(documentTree, editor);
        const reconciliationHeading = document.createElement('h2');
        reconciliationHeading.textContent = 'Out-of-band changes';
        const reconciliationLayout = document.createElement('div');
        reconciliationLayout.className = 'candidate-layout';
        const reconciliationList = document.createElement('nav');
        reconciliationList.className = 'candidate-list';
        const reconciliationDetail = document.createElement('div');
        reconciliationDetail.innerHTML = '<strong id="reconciliation-title">Select a change</strong><p id="reconciliation-status" class="source"></p><h3>Base</h3><pre id="reconciliation-base" class="diff"></pre><h3>Platform</h3><pre id="reconciliation-platform" class="diff"></pre><h3>External</h3><pre id="reconciliation-external" class="diff"></pre><div class="field" id="reconciliation-path-field" hidden><label for="reconciliation-path">External path</label><select id="reconciliation-path"></select></div><div class="field"><label for="reconciliation-final">Final content for conflicts</label><textarea id="reconciliation-final" spellcheck="false" disabled></textarea></div><div class="candidate-actions"><button type="button" id="reconciliation-import" disabled>Import external</button><button type="button" id="reconciliation-restore" disabled>Restore platform</button></div><p id="reconciliation-message"></p>';
        reconciliationLayout.append(reconciliationList, reconciliationDetail);
        const historyHeading = document.createElement('h2');
        historyHeading.textContent = 'Local history';
        const history = document.createElement('div');
        history.className = 'history';
        const restoreAction = document.createElement('div');
        const historyDiff = document.createElement('pre');
        const forgottenHeading = document.createElement('h2');
        forgottenHeading.textContent = 'Forgotten memories';
        const forgottenForm = document.createElement('form');
        forgottenForm.innerHTML = '<div class="field"><label for="forgotten-memory">Forgotten memory</label><select id="forgotten-memory" required></select></div><div class="field"><label for="forgotten-commit">Allowed history revision</label><select id="forgotten-commit" required></select></div><button type="submit">Restore as new transaction</button><p id="forgotten-message"></p>';
        historyDiff.className = 'diff';
        root.append(statusHeading, statusList, heading, form, table, bindingHeading, bindingForm, worktreeForm, bindingTable, searchHeading, searchForm, candidateHeading, candidateStatus, candidateLayout, sensitiveHeading, sensitiveLayout, editorHeading, editorLibrary, editorLayout, reconciliationHeading, reconciliationLayout, historyHeading, history, restoreAction, historyDiff, forgottenHeading, forgottenForm);

        let projectLibraries = [];
        let projectBindings = [];
        let allLibraries = [];
        let activeDocument = null;
        let deletionPreviewVersion = null;
        let deletionPreviewToken = null;
        let activeCandidate = null;
        let activeSensitiveRecord = null;
        let activeReconciliation = null;
        let sensitiveOffset = 0;
        const sensitivePageSize = 50;
        const historySelection = PamHistory.selectionStore();
        const editorContext = PamHistory.contextStore();

        function fillSelect(select, options, valueFor, labelFor) {
          const selected = select.value;
          select.replaceChildren();
          for (const optionValue of options) {
            const option = document.createElement('option');
            option.value = valueFor(optionValue);
            option.textContent = labelFor(optionValue);
            select.append(option);
          }
          if ([...select.options].some((option) => option.value === selected)) select.value = selected;
        }

        async function refresh() {
          const response = await fetch('/api/v1/libraries', {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          const libraries = await response.json();
          allLibraries = libraries;
          projectLibraries = libraries.filter((library) => library.kind === 'project');
          fillSelect(editorLibrary, libraries, (library) => library.id, (library) => `${library.canonical_path} (${library.kind})`);
          fillSelect(bindingForm.querySelector('#project-library'), projectLibraries, (library) => library.id, (library) => `${library.canonical_path} (${library.id})`);
          const body = table.querySelector('tbody');
          body.replaceChildren();
          for (const library of libraries) {
            const row = document.createElement('tr');
            for (const value of [library.id, library.kind, library.canonical_path, library.availability, library.sync_status, library.graph_status, library.graph_progress, library.graph_last_error || 'None']) {
              const cell = document.createElement('td');
              cell.textContent = value;
              if (value === library.canonical_path) cell.className = 'path';
              row.append(cell);
            }
            body.append(row);
          }
          await refreshBindings();
          await refreshCandidates();
          await refreshSensitiveQuarantine();
          await refreshDocuments();
          await refreshReconciliation();
        }

        async function refreshReconciliation(selectedId = activeReconciliation?.id) {
          const libraryId = editorLibrary.value;
          reconciliationList.replaceChildren();
          activeReconciliation = null;
          if (!libraryId) return;
          const response = await fetch(`/api/v1/libraries/${libraryId}/out-of-band-changes`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          const changes = await response.json();
          for (const change of changes) {
            const button = reconciliationList.appendChild(document.createElement('button'));
            button.type = 'button';
            button.textContent = `${change.status} · ${change.kind} · ${change.base_path}`;
            button.addEventListener('click', () => showReconciliation(change));
          }
          const selected = changes.find((change) => change.id === selectedId);
          if (selected) showReconciliation(selected);
        }

        function showReconciliation(change) {
          activeReconciliation = change;
          reconciliationDetail.querySelector('#reconciliation-title').textContent = change.base_path;
          const candidatePaths = change.external_candidates || [];
          reconciliationDetail.querySelector('#reconciliation-status').textContent = `${change.status} · ${change.kind}${change.external_path ? ` · ${change.external_path}` : ''}${candidatePaths.length > 1 ? ` · candidates: ${candidatePaths.join(', ')}` : ''}`;
          reconciliationDetail.querySelector('#reconciliation-base').textContent = change.base;
          reconciliationDetail.querySelector('#reconciliation-platform').textContent = change.platform;
          reconciliationDetail.querySelector('#reconciliation-external').textContent = change.external_withheld
            ? '(withheld: sensitive content is not stored or displayed)'
            : candidatePaths.length > 1
              ? `(ambiguous move: ${candidatePaths.join(', ')})`
              : change.external || '(deleted)';
          const finalContent = reconciliationDetail.querySelector('#reconciliation-final');
          const externalPath = reconciliationDetail.querySelector('#reconciliation-path');
          const pathField = reconciliationDetail.querySelector('#reconciliation-path-field');
          externalPath.replaceChildren();
          if (candidatePaths.length > 1) {
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select a candidate';
            externalPath.append(placeholder);
            for (const path of candidatePaths) {
              const option = document.createElement('option');
              option.value = path;
              option.textContent = path;
              externalPath.append(option);
            }
          }
          pathField.hidden = candidatePaths.length <= 1;
          const requiresFinal = change.status === 'conflict' || change.external_withheld;
          finalContent.disabled = !requiresFinal;
          finalContent.value = change.external_withheld
            ? ''
            : requiresFinal
              ? change.external || change.platform
              : '';
          const candidateMissing = candidatePaths.length > 1 && !externalPath.value;
          reconciliationDetail.querySelector('#reconciliation-import').disabled =
            (change.external_withheld && !finalContent.value.trim()) || candidateMissing;
          reconciliationDetail.querySelector('#reconciliation-restore').disabled = candidateMissing;
        }

        async function resolveReconciliation(action) {
          if (!activeReconciliation) return;
          const resolution = PamHistory.reconciliationRequest(
            editorLibrary.value,
            activeReconciliation,
            action,
            crypto.randomUUID(),
            reconciliationDetail.querySelector('#reconciliation-final').value,
            reconciliationDetail.querySelector('#reconciliation-path').value,
          );
          const response = await fetch(resolution.url, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(resolution.body)});
          const message = reconciliationDetail.querySelector('#reconciliation-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          message.className = '';
          message.textContent = action === 'import' ? 'External version imported.' : 'Platform version restored.';
          activeReconciliation = null;
          await refreshDocuments();
          await refreshReconciliation();
        }

        async function refreshCandidates(selectedId = activeCandidate?.id) {
          const statusQuery = candidateStatus.value ? `?candidate_status=${encodeURIComponent(candidateStatus.value)}` : '';
          const response = await fetch(`/api/v1/candidates${statusQuery}`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          const candidates = await response.json();
          candidateList.replaceChildren();
          for (const candidate of candidates) {
            const button = candidateList.appendChild(document.createElement('button'));
            button.type = 'button';
            button.textContent = `${candidate.status} · ${candidate.suggested_type} · ${candidate.id}`;
            button.addEventListener('click', () => showCandidate(candidate));
          }
          const selected = candidates.find((candidate) => candidate.id === selectedId);
          if (selected) showCandidate(selected);
          else if (activeCandidate && !selected) clearCandidate();
        }

        function clearCandidate() {
          activeCandidate = null;
          candidateDetail.querySelector('#candidate-title').textContent = 'Select a candidate';
          candidateDetail.querySelector('#candidate-sources').textContent = '';
          candidateDetail.querySelector('#candidate-body').value = '';
          for (const id of ['candidate-body', 'candidate-operator', 'candidate-reason', 'candidate-resolution', 'candidate-effective', 'candidate-condition', 'candidate-save', 'candidate-approve', 'candidate-resolve', 'candidate-reject']) candidateDetail.querySelector(`#${id}`).disabled = true;
        }

        async function showCandidate(candidate) {
          activeCandidate = candidate;
          const pending = candidate.status === 'pending';
          candidateDetail.querySelector('#candidate-title').textContent = `${candidate.suggested_type} · ${candidate.status}`;
          candidateDetail.querySelector('#candidate-sources').textContent = `Candidate sources · created by ${candidate.creator} at ${candidate.created_at} · ${candidate.source_references.join(' · ')}`;
          candidateDetail.querySelector('#candidate-body').value = candidate.body;
          candidateDetail.querySelector('#candidate-operator').value = candidate.operator || '';
          candidateDetail.querySelector('#candidate-reason').value = candidate.reason || '';
          for (const id of ['candidate-body', 'candidate-operator', 'candidate-reason', 'candidate-resolution', 'candidate-effective', 'candidate-condition', 'candidate-save', 'candidate-approve', 'candidate-resolve', 'candidate-reject']) candidateDetail.querySelector(`#${id}`).disabled = !pending;
          candidateDetail.querySelector('#candidate-message').textContent = candidate.published_path ? `Published as ${candidate.published_path} in ${candidate.commit}` : '';
          const response = await fetch(`/api/v1/candidates/${candidate.id}/governance`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok || activeCandidate?.id !== candidate.id) return;
          const governance = await response.json();
          candidateDetail.querySelector('#candidate-governance').textContent = `${governance.classification}${governance.target_path ? ` · ${governance.target_path}` : ''}${governance.effective_at ? ` · effective ${governance.effective_at}` : ''}`;
          const current = candidateDetail.querySelector('#candidate-current');
          current.hidden = !governance.current;
          current.textContent = governance.current ? `Current (${governance.current.path})\nSources: ${governance.current.source_references.join(' · ')}\nSource created: ${governance.current.source_created_at || 'not available'}\nRecorded: ${governance.current.recorded_at}\nEffective: ${governance.current.effective_at || 'initial version'}\n\n${governance.current.content}` : '';
          const diff = candidateDetail.querySelector('#candidate-conflict-diff');
          diff.hidden = !governance.diff;
          diff.textContent = governance.diff || '';
          candidateDetail.querySelector('#candidate-resolve').disabled = !pending || !['possible_duplicate', 'conflict'].includes(governance.classification);
        }

        async function candidateAction(action) {
          if (!activeCandidate) return;
          const operator = candidateDetail.querySelector('#candidate-operator').value;
          const reason = candidateDetail.querySelector('#candidate-reason').value;
          const body = candidateDetail.querySelector('#candidate-body').value;
          const url = action === 'edit' ? `/api/v1/candidates/${activeCandidate.id}` : `/api/v1/candidates/${activeCandidate.id}/${action}`;
          const payload = action === 'edit' ? {body, operator, reason} : {operator, reason, operation_id: crypto.randomUUID()};
          const response = await fetch(url, {method: action === 'edit' ? 'PUT' : 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
          const message = candidateDetail.querySelector('#candidate-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          message.className = '';
          activeCandidate = await response.json();
          showCandidate(activeCandidate);
          await refreshCandidates(activeCandidate.id);
          if (action === 'approve') await refreshDocuments();
        }

        async function resolveCandidate() {
          if (!activeCandidate) return;
          const action = candidateDetail.querySelector('#candidate-resolution').value;
          const effective = candidateDetail.querySelector('#candidate-effective').value;
          const payload = {
            action,
            operator: candidateDetail.querySelector('#candidate-operator').value,
            reason: candidateDetail.querySelector('#candidate-reason').value,
            operation_id: crypto.randomUUID(),
            merged_body: action === 'merge' ? candidateDetail.querySelector('#candidate-body').value : null,
            effective_at: effective ? new Date(effective).toISOString() : null,
            condition: action === 'scope' ? candidateDetail.querySelector('#candidate-condition').value : null,
          };
          const response = await fetch(`/api/v1/candidates/${activeCandidate.id}/resolve`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
          const message = candidateDetail.querySelector('#candidate-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          const result = await response.json();
          activeCandidate = result.candidate;
          await refreshCandidates(activeCandidate.id);
          await refreshDocuments();
        }

        async function refreshSensitiveQuarantine(selectedId = activeSensitiveRecord?.id) {
          const response = await fetch(`/api/v1/sensitive-quarantine?offset=${sensitiveOffset}&limit=${sensitivePageSize + 1}`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          const payload = await response.json();
          const records = payload.slice(0, sensitivePageSize);
          const hasNextPage = payload.length > sensitivePageSize;
          sensitiveList.replaceChildren();
          for (const record of records) {
            const button = sensitiveList.appendChild(document.createElement('button'));
            button.type = 'button';
            button.dataset.recordId = record.id;
            const status = record.resolved_at ? record.resolution : 'unresolved';
            button.textContent = `${record.disposition} · ${status} · ${record.created_at}`;
            button.addEventListener('click', () => showSensitiveRecord(record));
          }
          sensitivePagination.querySelector('#sensitive-previous').disabled = sensitiveOffset === 0;
          sensitivePagination.querySelector('#sensitive-next').disabled = !hasNextPage;
          sensitivePagination.querySelector('#sensitive-page').textContent = `${sensitiveOffset + 1}-${sensitiveOffset + records.length}`;
          sensitiveList.append(sensitivePagination);
          const selected = records.find((record) => record.id === selectedId);
          if (selected) showSensitiveRecord(selected);
          else clearSensitiveRecord();
        }

        function clearSensitiveRecord() {
          activeSensitiveRecord = null;
          sensitiveDetail.querySelector('#sensitive-title').textContent = 'Select a quarantine record';
          sensitiveDetail.querySelector('#sensitive-summary').textContent = '';
          sensitiveDetail.querySelector('#sensitive-metadata').textContent = '';
          sensitiveDetail.querySelector('#sensitive-message').textContent = '';
          sensitiveDetail.querySelector('#sensitive-acknowledge').disabled = true;
          sensitiveDetail.querySelector('#sensitive-discard').disabled = true;
        }

        function showSensitiveRecord(record) {
          activeSensitiveRecord = record;
          const open = !record.resolved_at;
          sensitiveDetail.querySelector('#sensitive-title').textContent = `${record.disposition} · ${open ? 'unresolved' : record.resolution}`;
          sensitiveDetail.querySelector('#sensitive-summary').textContent = record.summary;
          sensitiveDetail.querySelector('#sensitive-metadata').textContent = `${record.categories.join(', ')} · created ${record.created_at}${record.resolved_at ? ` · resolved ${record.resolved_at}` : ''}`;
          sensitiveDetail.querySelector('#sensitive-message').textContent = open ? '' : `Resolution: ${record.resolution}`;
          sensitiveDetail.querySelector('#sensitive-acknowledge').disabled = !open;
          sensitiveDetail.querySelector('#sensitive-discard').disabled = !open;
        }

        async function resolveSensitiveRecord(resolution) {
          if (!activeSensitiveRecord || activeSensitiveRecord.resolved_at) return;
          const response = await fetch(`/api/v1/sensitive-quarantine/${activeSensitiveRecord.id}/resolve`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({resolution})});
          const message = sensitiveDetail.querySelector('#sensitive-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          message.className = '';
          activeSensitiveRecord = await response.json();
          showSensitiveRecord(activeSensitiveRecord);
          await refreshSensitiveQuarantine(activeSensitiveRecord.id);
        }

        async function refreshDocuments() {
          const selectedLibrary = editorLibrary.value;
          const requestContext = editorContext.selectLibrary(selectedLibrary);
          documentTree.replaceChildren();
          history.replaceChildren();
          restoreAction.replaceChildren();
          historySelection.clear();
          historyDiff.textContent = '';
          activeDocument = null;
          deletionPreviewVersion = null;
          deletionPreviewToken = null;
          editor.querySelector('#document-path').textContent = 'Select a document';
          editor.querySelector('#document-source').value = '';
          editor.querySelector('#document-source').disabled = true;
          editor.querySelector('#preview-change').disabled = true;
          editor.querySelector('#save-change').disabled = true;
          editor.querySelector('#preview-delete').disabled = true;
          editor.querySelector('#confirm-delete').disabled = true;
          if (!selectedLibrary) return;
          const response = await fetch(`/api/v1/libraries/${selectedLibrary}/documents`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          if (!editorContext.isCurrent(requestContext)) return;
          for (const item of await response.json()) {
            if (!editorContext.isCurrent(requestContext)) return;
            const button = documentTree.appendChild(document.createElement('button'));
            button.type = 'button';
            button.textContent = item.path;
            button.addEventListener('click', () => loadDocument(item.path));
          }
          await refreshHistory();
          await refreshForgotten();
        }

        async function loadDocument(path) {
          restoreAction.replaceChildren();
          historySelection.clear();
          const selectedLibrary = editorLibrary.value;
          const requestContext = editorContext.requestDocument(selectedLibrary, path);
          const response = await fetch(`/api/v1/libraries/${selectedLibrary}/document?path=${encodeURIComponent(path)}`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          const loaded = await response.json();
          const accepted = editorContext.acceptDocument(requestContext, loaded);
          if (!accepted) return;
          activeDocument = loaded;
          editor.querySelector('#document-path').textContent = activeDocument.path;
          editor.querySelector('#document-source').value = activeDocument.content;
          editor.querySelector('#document-source').disabled = false;
          editor.querySelector('#preview-change').disabled = false;
          editor.querySelector('#save-change').disabled = false;
          editor.querySelector('#preview-delete').disabled = false;
          editor.querySelector('#confirm-delete').disabled = true;
          deletionPreviewVersion = null;
          deletionPreviewToken = null;
          showEditorPanel('source');
          await refreshHistory();
        }

        function showEditorPanel(panel) {
          editor.querySelector('#document-source').hidden = panel !== 'source';
          editor.querySelector('#document-preview').hidden = panel !== 'preview';
          editor.querySelector('#document-diff').hidden = panel !== 'diff';
        }

        async function previewChange(context = editorContext.snapshot()) {
          if (!context || !context.path || !context.sourceVersion) return false;
          const previewRequest = PamHistory.previewRequest(context);
          const response = await fetch(previewRequest.url, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(previewRequest.body)});
          const message = editor.querySelector('#editor-message');
          if (!editorContext.isCurrent(context)) return false;
          if (!response.ok) { const failure = await response.json(); if (!editorContext.isCurrent(context)) return false; message.className = 'error'; message.textContent = failure.detail; return false; }
          const preview = await response.json();
          if (!editorContext.isCurrent(context)) return false;
          editor.querySelector('#document-preview').srcdoc = preview.rendered_html;
          editor.querySelector('#document-diff').textContent = preview.diff || 'No changes.';
          message.className = '';
          message.textContent = 'Preview updated.';
          showEditorPanel('diff');
          return true;
        }

        async function refreshHistory() {
          const context = editorContext.snapshot();
          history.replaceChildren();
          if (!context || !context.libraryId) return;
          const selectedLibrary = context.libraryId;
          const response = await fetch(`/api/v1/libraries/${selectedLibrary}/history`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          if (!editorContext.isCurrent(context)) return;
          for (const entry of await response.json()) {
            if (!editorContext.isCurrent(context)) return;
            const button = history.appendChild(document.createElement('button'));
            button.type = 'button';
            button.textContent = `${entry.commit.slice(0, 12)}  ${entry.subject}`;
            button.title = `${entry.authored_at} · ${entry.actor_type || 'platform'} · ${entry.source || 'initialization'}`;
            button.addEventListener('click', async () => {
              const actionContext = editorContext.snapshot();
              if (!actionContext || !actionContext.path) return;
              const diffResponse = await fetch(`/api/v1/libraries/${selectedLibrary}/history/${entry.commit}/diff`, {headers: {Authorization: `Bearer ${key}`}});
              if (!editorContext.isCurrent(actionContext)) return;
              const diffPayload = diffResponse.ok ? await diffResponse.json() : null;
              if (!editorContext.isCurrent(actionContext)) return;
              if (diffPayload) historyDiff.textContent = diffPayload.diff;
              restoreAction.replaceChildren();
              const selection = historySelection.select(selectedLibrary, {
                path: actionContext.path,
                source_version: actionContext.sourceVersion,
                token: actionContext.token,
              }, entry.commit);
              const restore = document.createElement('button');
              restore.type = 'button';
              restore.textContent = `Restore ${selection.path} from ${selection.commit.slice(0, 12)}`;
              restore.addEventListener('click', () => restoreDocument(selection));
              restoreAction.append(restore);
            });
          }
        }

        async function restoreDocument(selection) {
          const context = editorContext.snapshot();
          if (!context || context.token !== selection.contextToken) return;
          const restore = PamHistory.request(selection, crypto.randomUUID());
          const response = await fetch(restore.url, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(restore.body)});
          if (!editorContext.isCurrent(context)) return;
          if (!response.ok) { const failure = await response.json(); if (!editorContext.isCurrent(context)) return; editor.querySelector('#editor-message').className = 'error'; editor.querySelector('#editor-message').textContent = failure.detail; return; }
          restoreAction.replaceChildren();
          historySelection.clear();
          if (editorContext.isCurrent(context)) await loadDocument(selection.path);
        }

        async function previewForgetting() {
          const context = editorContext.snapshot();
          if (!context || !context.path || !context.sourceVersion) return;
          const response = await fetch(`/api/v1/libraries/${context.libraryId}/document/delete-preview`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({path: context.path, expected_source_version: context.sourceVersion, operation_id: crypto.randomUUID()})});
          if (!editorContext.isCurrent(context)) return;
          const message = editor.querySelector('#editor-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          const preview = await response.json();
          editor.querySelector('#document-diff').textContent = JSON.stringify(preview, null, 2);
          showEditorPanel('diff');
          deletionPreviewVersion = context.sourceVersion;
          deletionPreviewToken = preview.preview_token;
          editor.querySelector('#confirm-delete').disabled = false;
          message.className = '';
          message.textContent = 'Review every affected source and derived store before forgetting.';
        }

        async function forgetDocument() {
          const context = editorContext.snapshot();
          if (!context || deletionPreviewVersion !== context.sourceVersion || !deletionPreviewToken) return;
          const response = await fetch(`/api/v1/libraries/${context.libraryId}/document`, {method: 'DELETE', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({path: context.path, expected_source_version: context.sourceVersion, preview_token: deletionPreviewToken, operation_id: crypto.randomUUID(), actor_type: 'user', source: 'web-delete'})});
          const message = editor.querySelector('#editor-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          message.className = '';
          message.textContent = 'Memory forgotten.';
          await refreshDocuments();
        }

        async function refreshForgotten() {
          const libraryId = editorLibrary.value;
          const memorySelect = forgottenForm.querySelector('#forgotten-memory');
          const commitSelect = forgottenForm.querySelector('#forgotten-commit');
          memorySelect.replaceChildren();
          commitSelect.replaceChildren();
          if (!libraryId) return;
          const [forgottenResponse, historyResponse] = await Promise.all([
            fetch(`/api/v1/libraries/${libraryId}/forgotten`, {headers: {Authorization: `Bearer ${key}`}}),
            fetch(`/api/v1/libraries/${libraryId}/history`, {headers: {Authorization: `Bearer ${key}`}}),
          ]);
          if (!forgottenResponse.ok || !historyResponse.ok) return;
          for (const item of await forgottenResponse.json()) {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = `${item.path} · deleted ${item.deleted_at}`;
            memorySelect.append(option);
          }
          for (const entry of await historyResponse.json()) {
            const option = document.createElement('option');
            option.value = entry.commit;
            option.textContent = `${entry.commit.slice(0, 12)} · ${entry.subject}`;
            commitSelect.append(option);
          }
        }

        async function refreshBindings() {
          const response = await fetch('/api/v1/project-bindings', {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) return;
          projectBindings = await response.json();
          const directBindings = projectBindings.filter((binding) => binding.kind === 'project');
          fillSelect(worktreeForm.querySelector('#main-binding'), directBindings, (binding) => binding.id, (binding) => `${binding.canonical_root} (${binding.id})`);
          const body = bindingTable.querySelector('tbody');
          body.replaceChildren();
          for (const binding of projectBindings) {
            const row = document.createElement('tr');
            for (const value of [binding.project_id, binding.kind, binding.canonical_root, binding.library_id, binding.availability]) {
              const cell = document.createElement('td');
              cell.textContent = value;
              if (value === binding.canonical_root) cell.className = 'path';
              row.append(cell);
            }
            const actions = document.createElement('td');
            if (binding.kind === 'project') {
              const librarySelect = document.createElement('select');
              fillSelect(librarySelect, projectLibraries, (library) => library.id, (library) => library.canonical_path);
              librarySelect.value = binding.library_id;
              librarySelect.setAttribute('aria-label', `Memory library for ${binding.canonical_root}`);
              librarySelect.addEventListener('change', async () => {
                await fetch(`/api/v1/project-bindings/${binding.id}`, {method: 'PUT', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({library_id: librarySelect.value})});
                await refreshBindings();
              });
              actions.append(librarySelect);
            }
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'danger';
            remove.textContent = binding.kind === 'project' ? 'Unbind' : 'Remove association';
            remove.addEventListener('click', async () => {
              await fetch(`/api/v1/project-bindings/${binding.id}`, {method: 'DELETE', headers: {Authorization: `Bearer ${key}`}});
              await refreshBindings();
            });
            actions.append(remove);
            row.append(actions);
            body.append(row);
          }
        }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const response = await fetch('/api/v1/libraries', {
            method: 'POST',
            headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({path: form.querySelector('#path').value, kind: form.querySelector('#kind').value, reuse_existing_git: form.querySelector('#reuse-existing-git').checked}),
          });
          const message = form.querySelector('#library-message');
          if (!response.ok) {
            const failure = await response.json();
            message.className = 'error';
            message.textContent = typeof failure.detail === 'string' ? failure.detail : failure.detail.reason;
            return;
          }
          message.className = '';
          message.textContent = 'Library registered.';
          form.querySelector('#path').value = '';
          await refresh();
        });
        bindingForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const response = await fetch('/api/v1/project-bindings', {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({project_root: bindingForm.querySelector('#project-root').value, library_id: bindingForm.querySelector('#project-library').value})});
          const message = bindingForm.querySelector('#binding-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = typeof failure.detail === 'string' ? failure.detail : failure.detail.reason; return; }
          message.className = '';
          message.textContent = 'Project bound.';
          bindingForm.querySelector('#project-root').value = '';
          await refreshBindings();
        });
        worktreeForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const response = await fetch('/api/v1/project-bindings/worktrees', {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({worktree_root: worktreeForm.querySelector('#worktree-root').value, main_project_binding_id: worktreeForm.querySelector('#main-binding').value})});
          const message = worktreeForm.querySelector('#worktree-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = typeof failure.detail === 'string' ? failure.detail : failure.detail.reason; return; }
          message.className = '';
          message.textContent = 'Worktree associated.';
          worktreeForm.querySelector('#worktree-root').value = '';
          await refreshBindings();
        });
        searchForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const response = await fetch('/api/v1/search', {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({cwd: searchForm.querySelector('#search-cwd').value, query: searchForm.querySelector('#search-query').value})});
          const message = searchForm.querySelector('#search-message');
          const results = searchForm.querySelector('#search-results');
          results.replaceChildren();
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          const payload = await response.json();
          message.className = '';
          message.textContent = payload.status === 'unbound' ? 'No project memory library is bound to this directory.' : `${payload.results.length} result(s) · graph ${payload.graph_index_status}${payload.degraded ? ` · degraded: ${payload.degradation.join(', ')}` : ''}.`;
          for (const hit of payload.results) {
            const article = document.createElement('article');
            article.className = 'search-result';
            const source = document.createElement('div');
            source.className = 'source';
            source.textContent = `${hit.path}:${hit.start_line}-${hit.end_line} · ${hit.heading || 'Untitled'} · ${hit.classification}${hit.graph_hop ? ` hop ${hit.graph_hop}` : ''} · ${hit.source_version}`;
            const content = document.createElement('pre');
            content.textContent = hit.content;
            article.append(source, content);
            results.append(article);
          }
        });
        candidateStatus.addEventListener('change', () => refreshCandidates());
        candidateDetail.querySelector('#candidate-save').addEventListener('click', () => candidateAction('edit'));
        candidateDetail.querySelector('#candidate-approve').addEventListener('click', () => candidateAction('approve'));
        candidateDetail.querySelector('#candidate-resolve').addEventListener('click', resolveCandidate);
        candidateDetail.querySelector('#candidate-reject').addEventListener('click', () => candidateAction('reject'));
        sensitiveDetail.querySelector('#sensitive-acknowledge').addEventListener('click', () => resolveSensitiveRecord('acknowledge'));
        sensitiveDetail.querySelector('#sensitive-discard').addEventListener('click', () => resolveSensitiveRecord('discard'));
        sensitivePagination.querySelector('#sensitive-previous').addEventListener('click', () => { sensitiveOffset = Math.max(0, sensitiveOffset - sensitivePageSize); refreshSensitiveQuarantine(); });
        sensitivePagination.querySelector('#sensitive-next').addEventListener('click', () => { sensitiveOffset += sensitivePageSize; refreshSensitiveQuarantine(); });
        sensitivePagination.querySelector('#sensitive-refresh').addEventListener('click', () => refreshSensitiveQuarantine());
        editorLibrary.addEventListener('change', async () => { await refreshDocuments(); await refreshReconciliation(); });
        reconciliationDetail.querySelector('#reconciliation-import').addEventListener('click', () => resolveReconciliation('import'));
        reconciliationDetail.querySelector('#reconciliation-restore').addEventListener('click', () => resolveReconciliation('restore'));
        reconciliationDetail.querySelector('#reconciliation-final').addEventListener('input', (event) => {
          const candidatePaths = activeReconciliation?.external_candidates || [];
          reconciliationDetail.querySelector('#reconciliation-import').disabled =
            (activeReconciliation?.external_withheld && !event.target.value.trim())
            || (candidatePaths.length > 1 && !reconciliationDetail.querySelector('#reconciliation-path').value);
        });
        reconciliationDetail.querySelector('#reconciliation-path').addEventListener('change', (event) => {
          reconciliationDetail.querySelector('#reconciliation-import').disabled =
            !event.target.value
            || (activeReconciliation?.external_withheld && !reconciliationDetail.querySelector('#reconciliation-final').value.trim());
          reconciliationDetail.querySelector('#reconciliation-restore').disabled = !event.target.value;
        });
        editor.querySelector('#source-tab').addEventListener('click', () => showEditorPanel('source'));
        editor.querySelector('#preview-tab').addEventListener('click', async () => { if (await previewChange()) showEditorPanel('preview'); });
        editor.querySelector('#diff-tab').addEventListener('click', previewChange);
        editor.querySelector('#preview-change').addEventListener('click', previewChange);
        editor.querySelector('#preview-delete').addEventListener('click', previewForgetting);
        editor.querySelector('#confirm-delete').addEventListener('click', forgetDocument);
        editor.querySelector('#document-source').addEventListener('input', () => {
          editorContext.edit(editor.querySelector('#document-source').value);
          restoreAction.replaceChildren();
          historySelection.clear();
          deletionPreviewVersion = null;
          deletionPreviewToken = null;
          editor.querySelector('#confirm-delete').disabled = true;
        });
        forgottenForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const libraryId = editorLibrary.value;
          const response = await fetch(`/api/v1/libraries/${libraryId}/forgotten/restore`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({tombstone_id: forgottenForm.querySelector('#forgotten-memory').value, commit: forgottenForm.querySelector('#forgotten-commit').value, operation_id: crypto.randomUUID(), actor_type: 'user', source: 'web-forgotten-history'})});
          const message = forgottenForm.querySelector('#forgotten-message');
          if (!response.ok) { const failure = await response.json(); message.className = 'error'; message.textContent = failure.detail; return; }
          message.className = '';
          message.textContent = 'Forgotten memory restored in a new commit.';
          await refreshDocuments();
        });
        editor.querySelector('#save-change').addEventListener('click', async () => {
          const context = editorContext.snapshot();
          if (!context || !(await previewChange(context)) || !editorContext.isCurrent(context)) return;
          const saveRequest = PamHistory.saveRequest(context, crypto.randomUUID());
          const response = await fetch(saveRequest.url, {method: 'PUT', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(saveRequest.body)});
          const message = editor.querySelector('#editor-message');
          if (!editorContext.isCurrent(context)) return;
          if (!response.ok) { const failure = await response.json(); if (!editorContext.isCurrent(context)) return; message.className = 'error'; message.textContent = failure.detail; return; }
          message.className = '';
          message.textContent = 'Document saved.';
          await loadDocument(context.path);
        });
        await refresh();
      });
    </script>
  </body>
</html>
