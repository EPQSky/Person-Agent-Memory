<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人智能体记忆 | Personal Agent Memory</title>
    <style>
      :root { --blue: #1664ff; --blue-soft: #e8f0ff; --teal: #00a870; --orange: #ff8800; --red: #d54941; --ink: #1d2129; --muted: #646a73; --line: #dee0e3; --surface: #fff; --canvas: #f5f6f7; color: var(--ink); background: var(--canvas); font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button, input, select, textarea { font: inherit; }
      button { min-height: 34px; margin-top: 12px; padding: 7px 14px; border: 1px solid transparent; border-radius: 6px; background: var(--blue); color: white; cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease; }
      button:hover:not(:disabled) { background: #0f55d9; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      button.secondary { border-color: var(--line); background: white; color: var(--ink); }
      button.secondary:hover:not(:disabled) { background: #f2f3f5; }
      button.danger { background: var(--red); }
      button.danger:hover:not(:disabled) { background: #b83b34; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(22,100,255,.24); outline-offset: 2px; }
      .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f6f7; }
      .login-panel { width: min(420px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: 8px; background: white; box-shadow: 0 10px 32px rgba(31,35,41,.08); }
      .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; margin-bottom: 20px; border-radius: 8px; background: var(--blue); color: white; font-size: 22px; font-weight: 700; }
      h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
      h2 { margin: 0 0 18px; font-size: 20px; letter-spacing: 0; }
      h3 { margin: 22px 0 8px; font-size: 15px; letter-spacing: 0; }
      .subtitle, .hint, .source { color: var(--muted); }
      .subtitle { margin: 4px 0 24px; }
      .app-shell { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
      .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 12px; border-right: 1px solid var(--line); background: white; }
      .sidebar-brand { padding: 0 10px 18px; font-weight: 700; font-size: 16px; }
      .sidebar-brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
      .nav-group { margin: 14px 10px 6px; color: var(--muted); font-size: 12px; }
      .nav-button { width: 100%; margin: 2px 0; text-align: left; background: transparent; color: var(--ink); }
      .nav-button:hover:not(:disabled) { background: #f2f3f5; }
      .nav-button[aria-current="page"] { background: var(--blue-soft); color: #0f55d9; font-weight: 650; }
      .app-main { min-width: 0; }
      .topbar { position: sticky; top: 0; z-index: 5; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
      .topbar button { margin: 0; }
      .connection { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
      .connection::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #8b9097; }
      .connection.ok::before { background: var(--teal); }
      .connection.warn::before { background: #ad5f00; }
      .connection.bad::before { background: var(--red); }
      .workspace { width: min(1240px, 100%); margin: 0 auto; padding: 24px; }
      .view[hidden] { display: none; }
      .view-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
      .view-section:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
      .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
      .metric { min-height: 106px; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: white; }
      .metric span { color: var(--muted); }
      .metric strong { display: block; margin-top: 10px; font-size: 25px; }
      .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .quick-actions button { margin: 0; }
      label { display: block; font-weight: 650; margin-bottom: 6px; }
      input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #bbbfc4; border-radius: 6px; background: white; color: var(--ink); }
      input[type="checkbox"] { width: auto; }
      dl { display: grid; grid-template-columns: 180px 1fr; gap: 8px; }
      dt { color: var(--muted); } dd { margin: 0; font-family: ui-monospace, monospace; }
      .error { color: var(--red); }
      .success { color: var(--teal); }
      .notice { min-height: 22px; margin: 8px 0 0; }
      .field { margin-top: 14px; }
      .table-scroll { overflow-x: auto; }
      table { width: 100%; min-width: 760px; border-collapse: collapse; margin-top: 14px; }
      th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: 12px; }
      td.path { overflow-wrap: anywhere; }
      .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 8px; border-radius: 5px; background: #f2f3f5; color: var(--muted); white-space: nowrap; }
      .badge.ok { background: #e8f8f2; color: #087f5b; }
      .badge.warn { background: #fff3e0; color: #ad5f00; }
      .badge.bad { background: #fdecea; color: #b83b34; }
      .empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed #bbbfc4; border-radius: 6px; }
      .search-result { border-top: 1px solid var(--line); padding: 14px 0; }
      .search-result pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      .source { font: 13px/1.4 ui-monospace, monospace; overflow-wrap: anywhere; }
      .editor-layout { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 3fr); gap: 18px; }
      .document-tree, .history { max-height: 520px; overflow: auto; border-right: 1px solid var(--line); padding-right: 12px; }
      .document-tree button, .history button { display: block; width: 100%; margin: 0 0 6px; text-align: left; overflow-wrap: anywhere; }
      textarea { min-height: 360px; resize: vertical; font: 14px/1.5 ui-monospace, monospace; white-space: pre; overflow: auto; }
      iframe { width: 100%; min-height: 360px; border: 1px solid var(--line); background: white; }
      .editor-tabs { display: flex; gap: 8px; margin: 12px 0; }
      .editor-tabs button { margin: 0; }
      .editor-tabs button[aria-selected="true"] { background: var(--blue); color: white; border-color: var(--blue); }
      .diff { max-height: 420px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, monospace; background: #f5f6f7; padding: 12px; border-radius: 6px; }
      .candidate-layout { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 18px; }
      .candidate-list { min-height: 120px; max-height: 420px; overflow: auto; border-right: 1px solid var(--line); padding-right: 12px; }
      .candidate-list button { display: block; width: 100%; margin: 0 0 6px; text-align: left; overflow-wrap: anywhere; }
      .candidate-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .candidate-actions button { flex: 0 0 auto; }
      dialog { width: min(480px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 18px 50px rgba(31,35,41,.22); }
      dialog::backdrop { background: rgba(31,35,41,.45); }
      .dialog-body { padding: 22px; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); }
      .dialog-actions button { margin: 0; }
      @media (max-width: 860px) { .app-shell { grid-template-columns: 1fr; } .sidebar { position: fixed; z-index: 10; width: 232px; transform: translateX(-100%); transition: transform 160ms ease; } .app-shell.nav-open .sidebar { transform: translateX(0); box-shadow: 8px 0 24px rgba(31,35,41,.14); } .metric-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
      @media (max-width: 720px) { .workspace { padding: 16px; } .topbar { padding: 0 16px; } .editor-layout, .candidate-layout { grid-template-columns: 1fr; } .document-tree, .history, .candidate-list { border-right: 0; max-height: 220px; } .metric-grid { grid-template-columns: 1fr; } dl { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <main class="login-shell" id="login-shell"><form id="root" class="login-panel"><div class="brand-mark" aria-hidden="true">记</div><h1>个人智能体记忆</h1><p class="subtitle">Personal Agent Memory</p><label for="key">API 密钥</label><input id="key" type="password" autocomplete="off" aria-describedby="message"><button id="connect" type="submit">进入管理工作台</button><p id="message" class="hint" aria-live="polite">请输入平台状态目录中保存的 API 密钥。密钥仅保留在当前页面内存中。</p></form></main>
    <script src="/editor-history.js"></script>
    <script>
      const root = document.querySelector('#root');
      document.querySelector('#root').addEventListener('submit', async (event) => {
        event.preventDefault();
        const key = document.querySelector('#key').value;
        const connect = document.querySelector('#connect');
        const loginMessage = document.querySelector('#message');
        if (!key) { loginMessage.className = 'error'; loginMessage.textContent = '请输入 API 密钥。'; return; }
        connect.disabled = true;
        connect.textContent = '正在连接...';
        let response;
        try { response = await fetch('/api/v1/status', {headers: {Authorization: `Bearer ${key}`}}); }
        catch (_error) { loginMessage.className = 'error'; loginMessage.textContent = '无法连接服务，请检查服务状态后重试。'; connect.disabled = false; connect.textContent = '进入管理工作台'; return; }
        if (!response.ok) { loginMessage.className = 'error'; loginMessage.textContent = '认证失败，请检查 API 密钥。'; connect.disabled = false; connect.textContent = '进入管理工作台'; return; }
        const data = await response.json();
        const loginShell = document.querySelector('#login-shell');
        loginShell.className = 'app-shell';
        root.replaceChildren();
        root.className = 'app-main';
        const statusHeading = document.createElement('h2');
        statusHeading.textContent = '服务状态';
        const statusList = document.createElement('dl');
        for (const [label, value] of [['数据库', data.database], ['后台任务', data.background_worker], ['API 密钥指纹', data.api_key_fingerprint], ['启动次数', data.startup_count]]) {
          const term = document.createElement('dt');
          const detail = document.createElement('dd');
          term.textContent = label;
          detail.textContent = ({ok: '正常', running: '运行中', error: '错误', not_configured: '未配置'}[value] || value);
          statusList.append(term, detail);
        }
        const heading = document.createElement('h2');
        heading.textContent = '记忆库';
        const form = document.createElement('form');
        form.innerHTML = '<div class="field"><label for="path">目录路径</label><input id="path" required></div><div class="field"><label for="kind">记忆库类型</label><select id="kind"><option value="project">项目记忆库</option><option value="user">用户记忆库</option></select></div><div class="field"><label><input id="reuse-existing-git" type="checkbox"> 授权使用此专用记忆仓库</label></div><button type="submit">注册记忆库</button><p id="library-message" class="notice" aria-live="polite"></p>';
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>标识符</th><th>类型</th><th>路径</th><th>可用性</th><th>文本索引</th><th>图索引</th><th>图索引进度</th><th>图索引错误</th></tr></thead><tbody></tbody>';
        const bindingHeading = document.createElement('h2');
        bindingHeading.textContent = '项目绑定';
        const bindingForm = document.createElement('form');
        bindingForm.innerHTML = '<div class="field"><label for="project-root">项目根目录</label><input id="project-root" required></div><div class="field"><label for="project-library">项目记忆库</label><select id="project-library" required></select></div><button type="submit">绑定项目</button><p id="binding-message" class="notice" aria-live="polite"></p>';
        const worktreeForm = document.createElement('form');
        worktreeForm.innerHTML = '<div class="field"><label for="worktree-root">Worktree 根目录</label><input id="worktree-root" required></div><div class="field"><label for="main-binding">主项目</label><select id="main-binding" required></select></div><button type="submit">关联 Worktree</button><p id="worktree-message" class="notice" aria-live="polite"></p>';
        const bindingTable = document.createElement('table');
        bindingTable.innerHTML = '<thead><tr><th>项目</th><th>关系</th><th>根目录</th><th>记忆库</th><th>可用性</th><th>操作</th></tr></thead><tbody></tbody>';
        const searchHeading = document.createElement('h2');
        searchHeading.textContent = '记忆检索';
        const searchForm = document.createElement('form');
        searchForm.innerHTML = '<div class="field"><label for="search-cwd">项目工作目录</label><input id="search-cwd" required></div><div class="field"><label for="search-query">关键词</label><input id="search-query" required></div><button type="submit">检索</button><p id="search-message" class="notice" aria-live="polite"></p><div id="search-results"></div>';
        const retentionHeading = document.createElement('h2');
        retentionHeading.textContent = '隐私设置';
        const retentionForm = document.createElement('form');
        retentionForm.innerHTML = '<div class="field"><label for="retention-library">记忆库</label><select id="retention-library"></select></div><div class="field"><label for="inbox-days">采集收件箱保留天数</label><input id="inbox-days" type="number" min="0" max="3650"></div><div class="field"><label for="candidate-days">候选记忆保留天数</label><input id="candidate-days" type="number" min="0" max="3650"></div><div class="field"><label for="recycle-days">回收站保留天数</label><input id="recycle-days" type="number" min="0" max="3650"></div><div class="field"><label><input id="early-inbox-cleanup" type="checkbox"> 提前清理已归并的收件箱数据</label></div><div class="field"><label><input id="diagnostics-enabled" type="checkbox"> 保留有界诊断数据</label></div><div class="field"><label for="diagnostic-days">诊断数据保留天数</label><input id="diagnostic-days" type="number" min="0" max="365"></div><div class="candidate-actions"><button type="submit">保存策略</button><button type="button" id="retention-preview" class="secondary">预览清理</button><button type="button" id="retention-run" class="danger">立即清理</button><button type="button" id="diagnostics-clear" class="danger">清除诊断</button></div><pre id="retention-impact" class="diff">选择记忆库后可预览清理影响。</pre><div id="candidate-recycle-bin"></div><p id="retention-message" class="notice" aria-live="polite"></p>';
        const candidateHeading = document.createElement('h2');
        candidateHeading.textContent = '候选审核';
        const candidateStatus = document.createElement('select');
        candidateStatus.setAttribute('aria-label', '候选记忆状态');
        candidateStatus.innerHTML = '<option value="">全部状态</option><option value="pending">待处理</option><option value="approved">已批准</option><option value="rejected">已拒绝</option>';
        const candidateLayout = document.createElement('div');
        candidateLayout.className = 'candidate-layout';
        const candidateList = document.createElement('nav');
        candidateList.className = 'candidate-list';
        const candidateDetail = document.createElement('div');
        candidateDetail.innerHTML = '<strong id="candidate-title">请选择候选记忆</strong><p id="candidate-sources" class="source"></p><p id="candidate-governance" class="source"></p><pre id="candidate-current" class="diff" hidden></pre><pre id="candidate-conflict-diff" class="diff" hidden></pre><textarea id="candidate-body" aria-label="候选记忆内容" spellcheck="false" disabled></textarea><div class="field"><label for="candidate-operator">操作人</label><input id="candidate-operator" disabled></div><div class="field"><label for="candidate-reason">裁决理由</label><input id="candidate-reason" disabled></div><div class="field"><label for="candidate-resolution">冲突裁决</label><select id="candidate-resolution" disabled><option value="keep">保留当前正式记忆</option><option value="adopt">采用候选记忆</option><option value="merge">合并为新版本</option><option value="scope">按不同条件并存</option></select></div><div class="field"><label for="candidate-effective">生效时间</label><input id="candidate-effective" type="datetime-local" disabled></div><div class="field"><label for="candidate-condition">适用条件</label><input id="candidate-condition" disabled></div><div class="candidate-actions"><button type="button" id="candidate-pin" class="secondary" disabled>置顶</button><button type="button" id="candidate-save" disabled>保存编辑</button><button type="button" id="candidate-approve" disabled>批准</button><button type="button" id="candidate-resolve" disabled>提交裁决</button><button type="button" id="candidate-reject" class="danger" disabled>拒绝</button></div><p id="candidate-message" class="notice" aria-live="polite"></p>';
        candidateLayout.append(candidateList, candidateDetail);
        const sensitiveHeading = document.createElement('h2');
        sensitiveHeading.textContent = '敏感隔离';
        const sensitiveLayout = document.createElement('div');
        sensitiveLayout.className = 'candidate-layout';
        const sensitiveList = document.createElement('nav');
        sensitiveList.id = 'sensitive-quarantine-list';
        sensitiveList.className = 'candidate-list';
        const sensitivePagination = document.createElement('div');
        sensitivePagination.className = 'candidate-actions';
        sensitivePagination.innerHTML = '<button type="button" id="sensitive-previous" class="secondary">上一页</button><span id="sensitive-page"></span><button type="button" id="sensitive-next" class="secondary">下一页</button><button type="button" id="sensitive-refresh" class="secondary">刷新</button>';
        sensitiveList.append(sensitivePagination);
        const sensitiveDetail = document.createElement('div');
        sensitiveDetail.id = 'sensitive-quarantine-detail';
        sensitiveDetail.innerHTML = '<strong id="sensitive-title">请选择隔离记录</strong><p id="sensitive-summary"></p><p id="sensitive-metadata" class="source"></p><div class="candidate-actions"><button type="button" id="sensitive-acknowledge" disabled>已知悉</button><button type="button" id="sensitive-discard" class="danger" disabled>丢弃</button></div><p id="sensitive-message" class="notice" aria-live="polite"></p>';
        sensitiveLayout.append(sensitiveList, sensitiveDetail);
        const editorHeading = document.createElement('h2');
        editorHeading.textContent = '文档管理';
        const editorLibrary = document.createElement('select');
        editorLibrary.setAttribute('aria-label', '要编辑的记忆库');
        const editorLayout = document.createElement('div');
        editorLayout.className = 'editor-layout';
        const documentTree = document.createElement('nav');
        documentTree.className = 'document-tree';
        const editor = document.createElement('div');
        editor.innerHTML = '<strong id="document-path">请从文档列表选择内容</strong><div class="editor-tabs" role="tablist"><button type="button" id="source-tab" class="secondary" role="tab" aria-selected="true">Markdown 源文</button><button type="button" id="preview-tab" class="secondary" role="tab" aria-selected="false">渲染预览</button><button type="button" id="diff-tab" class="secondary" role="tab" aria-selected="false">差异</button></div><textarea id="document-source" aria-label="Markdown 源文" spellcheck="false" disabled></textarea><iframe id="document-preview" sandbox hidden title="Markdown 渲染预览"></iframe><pre id="document-diff" class="diff" hidden></pre><button type="button" id="preview-change" class="secondary" disabled>预览变更</button><button type="button" id="save-change" disabled>保存</button><button type="button" id="preview-delete" class="danger" disabled>预览遗忘影响</button><button type="button" id="confirm-delete" class="danger" disabled>确认遗忘</button><p id="editor-message" class="notice" aria-live="polite"></p>';
        editorLayout.append(documentTree, editor);
        const reconciliationHeading = document.createElement('h2');
        reconciliationHeading.textContent = '带外变更';
        const reconciliationLayout = document.createElement('div');
        reconciliationLayout.className = 'candidate-layout';
        const reconciliationList = document.createElement('nav');
        reconciliationList.className = 'candidate-list';
        const reconciliationDetail = document.createElement('div');
        reconciliationDetail.innerHTML = '<strong id="reconciliation-title">请选择带外变更</strong><p id="reconciliation-status" class="source"></p><h3>基准内容</h3><pre id="reconciliation-base" class="diff"></pre><h3>平台内容</h3><pre id="reconciliation-platform" class="diff"></pre><h3>外部内容</h3><pre id="reconciliation-external" class="diff"></pre><div class="field" id="reconciliation-path-field" hidden><label for="reconciliation-path">外部路径</label><select id="reconciliation-path"></select></div><div class="field"><label for="reconciliation-final">冲突的最终内容</label><textarea id="reconciliation-final" spellcheck="false" disabled></textarea></div><div class="candidate-actions"><button type="button" id="reconciliation-import" disabled>导入外部版本</button><button type="button" id="reconciliation-restore" disabled>恢复平台版本</button></div><p id="reconciliation-message" class="notice" aria-live="polite"></p>';
        reconciliationLayout.append(reconciliationList, reconciliationDetail);
        const historyHeading = document.createElement('h2');
        historyHeading.textContent = '本地历史';
        const history = document.createElement('div');
        history.className = 'history';
        const restoreAction = document.createElement('div');
        const historyDiff = document.createElement('pre');
        const forgottenHeading = document.createElement('h2');
        forgottenHeading.textContent = '遗忘记忆恢复';
        const forgottenForm = document.createElement('form');
        forgottenForm.innerHTML = '<div class="field"><label for="forgotten-memory">遗忘记忆</label><select id="forgotten-memory" required></select></div><div class="field"><label for="forgotten-commit">允许恢复的历史版本</label><select id="forgotten-commit" required></select></div><button type="submit">作为新事务恢复</button><p id="forgotten-message" class="notice" aria-live="polite"></p>';
        historyDiff.className = 'diff';
        const sidebar = document.createElement('aside');
        sidebar.className = 'sidebar';
        sidebar.id = 'workspace-sidebar';
        sidebar.innerHTML = '<div class="sidebar-brand">个人智能体记忆<small>Personal Agent Memory</small></div><nav aria-label="工作台导航"><button class="nav-button" data-view="overview" aria-current="page">概览</button><button class="nav-button" data-view="search">记忆检索</button><button class="nav-button" data-view="candidates">候选审核</button><button class="nav-button" data-view="documents">文档管理</button><div class="nav-group">管理与治理</div><button class="nav-button" data-view="libraries">记忆库</button><button class="nav-button" data-view="bindings">项目绑定</button><button class="nav-button" data-view="sensitive">敏感隔离</button><button class="nav-button" data-view="history">历史恢复</button><button class="nav-button" data-view="privacy">隐私设置</button></nav>';

        async function performOnce(name, button, busyLabel, action, messageNode = null, contextIsCurrent = () => true) {

          try { return await action(); }

            if (nearbyMessage && contextIsCurrent()) setMessage(nearbyMessage, '操作失败：网络连接或响应异常，请重试。', 'error');
            return null;
          } finally {
            pending.delete(name);
            if (buttonOperations.get(button) === operation) {
              buttonOperations.delete(button);
              if (contextIsCurrent()) {
                setBusy(button, false, busyLabel);
                if (button.dataset.keepDisabled === 'true') button.disabled = true;
              } else {

          const [policyResponse, recycleResponse] = await Promise.all([
            request(`/api/v1/libraries/${libraryId}/retention-policy`, {headers: {Authorization: `Bearer ${key}`}}),
            request(`/api/v1/libraries/${libraryId}/candidate-recycle-bin`, {headers: {Authorization: `Bearer ${key}`}}),

          const payload = await response.json();

        async function runRetentionCleanup() {

            setMessage(retentionForm.querySelector('#retention-message'), '请先为当前记忆库完成清理预览。', 'error');

          const previewSummary = preview.summary.replaceAll('\n', '；');
          if (!await confirmAction('确认立即清理', `记忆库 ${libraryId} 将按照当前保留策略清理数据，预计影响 ${preview.affectedCount} 条。${previewSummary}`)) return;
          if (!retentionPreviewContext || retentionPreviewContext.libraryId !== libraryId || retentionPreviewContext.generation !== generations.retention || libraryId !== retentionForm.querySelector('#retention-library').value) return;
          const button = retentionForm.querySelector('#retention-run');
          await performOnce(`retention-run-${libraryId}`, button, '正在清理...', async () => {
            const response = await request(`/api/v1/libraries/${libraryId}/retention-cleanup`, {method: 'POST', headers: {Authorization: `Bearer ${key}`}});
            if (generation !== generations.retention || libraryId !== retentionForm.querySelector('#retention-library').value) return;
            if (response.ok) {
              button.dataset.keepDisabled = 'true';
              await Promise.all([refreshRetention(), refreshCandidates()]);
              if (preview.selectionGeneration === retentionSelectionGeneration && libraryId === retentionForm.querySelector('#retention-library').value) setMessage(retentionForm.querySelector('#retention-message'), '保留数据清理完成。', 'success');
            } else setMessage(retentionForm.querySelector('#retention-message'), '保留数据清理失败。', 'error');
          }, null, () => generation === generations.retention && libraryId === retentionForm.querySelector('#retention-library').value);
        }

        async function refreshReconciliation(selectedId = activeReconciliation?.id) {
          const generation = ++generations.reconciliation;
          const libraryId = editorLibrary.value;
          clearReconciliation(false);
          if (!libraryId) { reconciliationList.innerHTML = '<p class="empty">请先选择记忆库。</p>'; return; }
          reconciliationList.innerHTML = '<p class="empty">正在加载带外变更...</p>';
          const response = await request(`/api/v1/libraries/${libraryId}/out-of-band-changes`, {headers: {Authorization: `Bearer ${key}`}});
          if (generation !== generations.reconciliation || libraryId !== editorLibrary.value) return;
          if (!response.ok) { reconciliationList.innerHTML = '<p class="empty error">带外变更加载失败，请切换记忆库后重试。</p>'; return; }
          const changes = await response.json();
          if (generation !== generations.reconciliation || libraryId !== editorLibrary.value) return;
          reconciliationList.replaceChildren();
          for (const change of changes) {
            const button = reconciliationList.appendChild(document.createElement('button'));
            button.type = 'button';
            button.className = 'secondary';
            button.textContent = `${display(change.status)} · ${display(change.kind)} · ${change.base_path}`;
            button.addEventListener('click', () => showReconciliation(change, {libraryId, generation}));
          }
          const selected = changes.find((change) => change.id === selectedId);
          if (selected) showReconciliation(selected, {libraryId, generation});
          if (!changes.length) reconciliationList.innerHTML = '<p class="empty">没有待处理的带外变更。</p>';
        }

        function clearReconciliation(invalidate = true) {
          if (invalidate) ++generations.reconciliation;
          activeReconciliation = null;
          reconciliationList.replaceChildren();
          reconciliationDetail.querySelector('#reconciliation-title').textContent = '请选择带外变更';
          reconciliationDetail.querySelector('#reconciliation-status').textContent = '';
          for (const id of ['reconciliation-base', 'reconciliation-platform', 'reconciliation-external']) reconciliationDetail.querySelector(`#${id}`).textContent = '';
          reconciliationDetail.querySelector('#reconciliation-final').value = '';
          reconciliationDetail.querySelector('#reconciliation-final').disabled = true;
          reconciliationDetail.querySelector('#reconciliation-path').replaceChildren();
          reconciliationDetail.querySelector('#reconciliation-path-field').hidden = true;
          reconciliationDetail.querySelector('#reconciliation-import').disabled = true;
          reconciliationDetail.querySelector('#reconciliation-restore').disabled = true;
          setMessage(reconciliationDetail.querySelector('#reconciliation-message'), '');
        }

        function reconciliationContextIsCurrent(context) {
          return context.generation === generations.reconciliation && context.libraryId === editorLibrary.value;
        }

        function showReconciliation(change, context) {
          if (!reconciliationContextIsCurrent(context)) return;
          activeReconciliation = {...change, uiContext: context};
          reconciliationDetail.querySelector('#reconciliation-title').textContent = change.base_path;
          const candidatePaths = change.external_candidates || [];
          reconciliationDetail.querySelector('#reconciliation-status').textContent = `${display(change.status)} · ${display(change.kind)}${change.external_path ? ` · ${change.external_path}` : ''}${candidatePaths.length > 1 ? ` · 候选路径：${candidatePaths.join(', ')}` : ''}`;
          reconciliationDetail.querySelector('#reconciliation-base').textContent = change.base;
          reconciliationDetail.querySelector('#reconciliation-platform').textContent = change.platform;
          reconciliationDetail.querySelector('#reconciliation-external').textContent = change.external_withheld
            ? '（敏感内容已隐去：不会存储或展示）'
            : candidatePaths.length > 1
              ? `（移动目标不明确：${candidatePaths.join(', ')}）`
              : change.external || '（已删除）';
          const finalContent = reconciliationDetail.querySelector('#reconciliation-final');
          const externalPath = reconciliationDetail.querySelector('#reconciliation-path');
          const pathField = reconciliationDetail.querySelector('#reconciliation-path-field');
          externalPath.replaceChildren();
          if (candidatePaths.length > 1) {
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '请选择候选路径';
            externalPath.append(placeholder);
            for (const path of candidatePaths) {
              const option = document.createElement('option');
              option.value = path;
              option.textContent = path;
              externalPath.append(option);
            }
          }
          pathField.hidden = candidatePaths.length <= 1;
          const requiresFinal = change.status === 'conflict' || change.external_withheld;
          finalContent.disabled = !requiresFinal;
          finalContent.value = change.external_withheld
            ? ''
            : requiresFinal
              ? change.external || change.platform
              : '';
          const candidateMissing = candidatePaths.length > 1 && !externalPath.value;
          reconciliationDetail.querySelector('#reconciliation-import').disabled =
            (change.external_withheld && !finalContent.value.trim()) || candidateMissing;
          reconciliationDetail.querySelector('#reconciliation-restore').disabled = candidateMissing;
        }

        async function resolveReconciliation(action) {
          if (!activeReconciliation) return;
          const selected = activeReconciliation;
          const context = selected.uiContext;
          if (!context || !reconciliationContextIsCurrent(context)) return;
          const button = reconciliationDetail.querySelector(action === 'import' ? '#reconciliation-import' : '#reconciliation-restore');
          if (!await confirmAction(action === 'import' ? '确认导入外部版本' : '确认恢复平台版本', `将处理 ${selected.base_path}，并创建新的记忆变更事务。`)) return;
          if (!reconciliationContextIsCurrent(context) || activeReconciliation?.id !== selected.id) return;
          await performOnce(`reconciliation-${selected.id}`, button, '正在提交...', async () => {
          const resolution = PamHistory.reconciliationRequest(
            context.libraryId,
            selected,
            action,
            crypto.randomUUID(),
            reconciliationDetail.querySelector('#reconciliation-final').value,
            reconciliationDetail.querySelector('#reconciliation-path').value,
          );
          const response = await request(resolution.url, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(resolution.body)});
          const message = reconciliationDetail.querySelector('#reconciliation-message');
          if (!reconciliationContextIsCurrent(context) || activeReconciliation?.id !== selected.id) return;
          if (!response.ok) { const failure = await response.json(); setMessage(message, describeError(failure, '带外变更处理失败'), 'error'); return; }
          button.dataset.keepDisabled = 'true';
          activeReconciliation = null;
          await refreshDocuments();
          if (editorLibrary.value === context.libraryId) setMessage(message, action === 'import' ? '已导入外部版本。' : '已恢复平台版本。', 'success');
          }, null, () => reconciliationContextIsCurrent(context) && activeReconciliation?.id === selected.id);
        }

        async function refreshCandidates(selectedId = activeCandidate?.id) {
          const generation = ++generations.candidates;
          const statusQuery = candidateStatus.value ? `?candidate_status=${encodeURIComponent(candidateStatus.value)}` : '';
          candidateList.innerHTML = '<p class="empty">正在加载候选记忆...</p>';
          const response = await request(`/api/v1/candidates${statusQuery}`, {headers: {Authorization: `Bearer ${key}`}});
          if (generation !== generations.candidates) return;
          if (!response.ok) { candidateList.innerHTML = '<p class="empty error">候选记忆加载失败，请重试。</p>'; return; }
          const candidates = await response.json();
          if (generation !== generations.candidates) return;
          candidateList.replaceChildren();
          for (const candidate of candidates) {
            const button = candidateList.appendChild(document.createElement('button'));
            button.type = 'button';
            button.className = 'secondary';
            button.textContent = `${display(candidate.status)} · ${display(candidate.suggested_type)} · ${candidate.id}`;
            button.addEventListener('click', () => { ++candidateSelectionGeneration; showCandidate(candidate); });
          }
          const selected = candidates.find((candidate) => candidate.id === selectedId);
          if (selected) await showCandidate(selected);
          else if (activeCandidate && !selected) clearCandidate();
          if (!candidates.length) candidateList.innerHTML = `<p class="empty">${candidateStatus.value ? '当前筛选条件下没有候选记忆。' : '还没有候选记忆。'}</p>`;
        }

        function clearCandidate() {
          ++generations.candidateGovernance;
          activeCandidate = null;
          candidateDetail.querySelector('#candidate-title').textContent = '请选择候选记忆';
          candidateDetail.querySelector('#candidate-sources').textContent = '';
          clearCandidateGovernance();
          candidateDetail.querySelector('#candidate-body').value = '';
          candidateDetail.querySelector('#candidate-message').textContent = '';
          for (const id of ['candidate-body', 'candidate-operator', 'candidate-reason', 'candidate-resolution', 'candidate-effective', 'candidate-condition', 'candidate-pin', 'candidate-save', 'candidate-approve', 'candidate-resolve', 'candidate-reject']) candidateDetail.querySelector(`#${id}`).disabled = true;
        }

        function clearCandidateGovernance() {
          candidateDetail.querySelector('#candidate-governance').textContent = '';
          const current = candidateDetail.querySelector('#candidate-current');
          current.hidden = true;
          current.textContent = '';
          const diff = candidateDetail.querySelector('#candidate-conflict-diff');
          diff.hidden = true;
          diff.textContent = '';
          candidateDetail.querySelector('#candidate-resolve').disabled = true;
        }

        async function showCandidate(candidate) {
          const governanceGeneration = ++generations.candidateGovernance;
          activeCandidate = candidate;
          const candidateId = candidate.id;
          const pending = candidate.status === 'pending';
          candidateDetail.querySelector('#candidate-title').textContent = `${display(candidate.suggested_type)} · ${display(candidate.status)}`;
          candidateDetail.querySelector('#candidate-sources').textContent = `候选来源 · ${candidate.creator} 创建于 ${candidate.created_at} · ${candidate.source_references.join(' · ')}`;
          candidateDetail.querySelector('#candidate-body').value = candidate.body;
          candidateDetail.querySelector('#candidate-operator').value = candidate.operator || '';
          candidateDetail.querySelector('#candidate-reason').value = candidate.reason || '';
          for (const id of ['candidate-body', 'candidate-operator', 'candidate-reason', 'candidate-resolution', 'candidate-effective', 'candidate-condition', 'candidate-pin', 'candidate-save', 'candidate-approve', 'candidate-resolve', 'candidate-reject']) candidateDetail.querySelector(`#${id}`).disabled = !pending;
          clearCandidateGovernance();
          candidateDetail.querySelector('#candidate-message').textContent = candidate.published_path ? `已发布为 ${candidate.published_path}，提交 ${candidate.commit}` : '';
          const response = await request(`/api/v1/candidates/${candidate.id}/governance`, {headers: {Authorization: `Bearer ${key}`}});
          if (governanceGeneration !== generations.candidateGovernance || activeCandidate?.id !== candidateId) return;
          if (!response.ok) {
            const failure = await response.json();
            if (governanceGeneration === generations.candidateGovernance && activeCandidate?.id === candidateId) setMessage(candidateDetail.querySelector('#candidate-message'), describeError(failure, '候选治理信息加载失败'), 'error');
            return;
          }
          const governance = await response.json();
          if (governanceGeneration !== generations.candidateGovernance || activeCandidate?.id !== candidateId) return;
          candidateDetail.querySelector('#candidate-governance').textContent = `${display(governance.classification)}${governance.target_path ? ` · ${governance.target_path}` : ''}${governance.effective_at ? ` · 生效于 ${governance.effective_at}` : ''}`;
          const current = candidateDetail.querySelector('#candidate-current');
          current.hidden = !governance.current;
          current.textContent = governance.current ? `当前正式记忆（${governance.current.path}）\n来源：${governance.current.source_references.join(' · ')}\n来源创建时间：${governance.current.source_created_at || '不可用'}\n记录时间：${governance.current.recorded_at}\n生效时间：${governance.current.effective_at || '初始版本'}\n\n${governance.current.content}` : '';
          const diff = candidateDetail.querySelector('#candidate-conflict-diff');
          diff.hidden = !governance.diff;
          diff.textContent = governance.diff || '';
          candidateDetail.querySelector('#candidate-resolve').disabled = !pending || !['possible_duplicate', 'conflict'].includes(governance.classification);
        }

        async function candidateAction(action) {
          if (!activeCandidate || activeCandidate.status !== 'pending') return;
          const candidateId = activeCandidate.id;
          const selectionGeneration = candidateSelectionGeneration;
          const contextIsCurrent = () => selectionGeneration === candidateSelectionGeneration && activeCandidate?.id === candidateId;
          const button = candidateDetail.querySelector(`#candidate-${action === 'edit' ? 'save' : action}`);
          await performOnce(`candidate-${candidateId}`, button, '正在提交...', async () => {
          if (!contextIsCurrent() || activeCandidate.status !== 'pending') return;
          const operator = candidateDetail.querySelector('#candidate-operator').value;
          const reason = candidateDetail.querySelector('#candidate-reason').value;
          const body = candidateDetail.querySelector('#candidate-body').value;
          const url = action === 'edit' ? `/api/v1/candidates/${candidateId}` : `/api/v1/candidates/${candidateId}/${action}`;
          const payload = action === 'edit' ? {body, operator, reason} : {operator, reason, operation_id: crypto.randomUUID()};
          const response = await request(url, {method: action === 'edit' ? 'PUT' : 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
          const message = candidateDetail.querySelector('#candidate-message');
          if (selectionGeneration !== candidateSelectionGeneration || activeCandidate?.id !== candidateId) return;
          if (!response.ok) { const failure = await response.json(); if (selectionGeneration === candidateSelectionGeneration && activeCandidate?.id === candidateId) setMessage(message, describeError(failure, '候选操作失败'), 'error'); return; }
          const updatedCandidate = await response.json();
          if (selectionGeneration !== candidateSelectionGeneration || activeCandidate?.id !== candidateId) return;
          activeCandidate = updatedCandidate;
          if (activeCandidate.status !== 'pending') button.dataset.keepDisabled = 'true';
          await refreshCandidates(activeCandidate.id);
          if (action === 'approve') await refreshDocuments();
          if (selectionGeneration === candidateSelectionGeneration && (!activeCandidate || activeCandidate.id === candidateId)) setMessage(message, action === 'edit' ? '候选记忆已保存。' : action === 'approve' ? '候选记忆已批准。' : '候选记忆已拒绝。', 'success');
          }, null, contextIsCurrent);
        }

        async function resolveCandidate() {
          if (!activeCandidate || activeCandidate.status !== 'pending') return;
          const candidateId = activeCandidate.id;
          const selectionGeneration = candidateSelectionGeneration;
          const contextIsCurrent = () => selectionGeneration === candidateSelectionGeneration && activeCandidate?.id === candidateId;
          const button = candidateDetail.querySelector('#candidate-resolve');
          await performOnce(`candidate-${candidateId}`, button, '正在裁决...', async () => {
          if (!contextIsCurrent() || activeCandidate.status !== 'pending') return;
          const action = candidateDetail.querySelector('#candidate-resolution').value;
          const effective = candidateDetail.querySelector('#candidate-effective').value;
          const payload = {
            action,
            operator: candidateDetail.querySelector('#candidate-operator').value,
            reason: candidateDetail.querySelector('#candidate-reason').value,
            operation_id: crypto.randomUUID(),
            merged_body: action === 'merge' ? candidateDetail.querySelector('#candidate-body').value : null,
            effective_at: effective ? new Date(effective).toISOString() : null,
            condition: action === 'scope' ? candidateDetail.querySelector('#candidate-condition').value : null,
          };
          const response = await request(`/api/v1/candidates/${candidateId}/resolve`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
          const message = candidateDetail.querySelector('#candidate-message');
          if (selectionGeneration !== candidateSelectionGeneration || activeCandidate?.id !== candidateId) return;
          if (!response.ok) { const failure = await response.json(); if (selectionGeneration === candidateSelectionGeneration && activeCandidate?.id === candidateId) setMessage(message, describeError(failure, '冲突裁决失败'), 'error'); return; }
          const result = await response.json();
          if (selectionGeneration !== candidateSelectionGeneration || activeCandidate?.id !== candidateId) return;
          activeCandidate = result.candidate;
          button.dataset.keepDisabled = 'true';
          await refreshCandidates(activeCandidate.id);
          await refreshDocuments();
          if (selectionGeneration === candidateSelectionGeneration && (!activeCandidate || activeCandidate.id === candidateId)) setMessage(message, '冲突裁决已提交。', 'success');
          }, null, contextIsCurrent);
        }

        async function pinCandidate() {
          if (!activeCandidate) return;
          const candidateId = activeCandidate.id;
          const selectionGeneration = candidateSelectionGeneration;
          const contextIsCurrent = () => selectionGeneration === candidateSelectionGeneration && activeCandidate?.id === candidateId;
          const button = candidateDetail.querySelector('#candidate-pin');
          await performOnce(`candidate-${candidateId}`, button, '正在置顶...', async () => {
            if (!contextIsCurrent()) return;
            const response = await request(`/api/v1/candidates/${candidateId}/pin`, {method: 'PUT', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({pinned: true})});
            const message = candidateDetail.querySelector('#candidate-message');
            if (selectionGeneration !== candidateSelectionGeneration || activeCandidate?.id !== candidateId) return;
            if (!response.ok) { setMessage(message, '候选记忆置顶失败。', 'error'); return; }
            await refreshCandidates(candidateId);
            if (selectionGeneration === candidateSelectionGeneration && activeCandidate?.id === candidateId) setMessage(message, '候选记忆已置顶。', 'success');
          }, null, contextIsCurrent);
        }

        async function refreshSensitiveQuarantine(selectedId = activeSensitiveRecord?.id, selectionContext = null) {
          const generation = ++generations.sensitive;
          sensitiveList.replaceChildren();
          sensitiveList.innerHTML = '<p class="empty">正在加载敏感隔离记录...</p>';
          const response = await request(`/api/v1/sensitive-quarantine?offset=${sensitiveOffset}&limit=${sensitivePageSize + 1}`, {headers: {Authorization: `Bearer ${key}`}});
          if (generation !== generations.sensitive) return;
          if (!response.ok) { sensitiveList.innerHTML = '<p class="empty error">敏感隔离记录加载失败，请重试。</p>'; sensitiveList.append(sensitivePagination); return; }
          const payload = await response.json();
          if (generation !== generations.sensitive) return;
          const records = payload.slice(0, sensitivePageSize);
          const hasNextPage = payload.length > sensitivePageSize;
          sensitiveList.replaceChildren();
          for (const record of records) {
            const button = sensitiveList.appendChild(document.createElement('button'));
            button.type = 'button';
            button.dataset.recordId = record.id;
            const status = record.resolved_at ? record.resolution : 'unresolved';
            button.className = 'secondary';
            button.textContent = `${display(record.disposition)} · ${display(status)} · ${record.created_at}`;
            button.addEventListener('click', () => showSensitiveRecord(record));
          }
          sensitivePagination.querySelector('#sensitive-previous').disabled = sensitiveOffset === 0;
          sensitivePagination.querySelector('#sensitive-next').disabled = !hasNextPage;
          sensitivePagination.querySelector('#sensitive-page').textContent = `${sensitiveOffset + 1}-${sensitiveOffset + records.length}`;
          sensitiveList.append(sensitivePagination);
          if (selectionContext && (activeSensitiveRecord?.id !== selectionContext.recordId || sensitiveSelectionGeneration !== selectionContext.selectionGeneration)) return;
          const selected = records.find((record) => record.id === selectedId);
          if (selected) showSensitiveRecord(selected, selected.id !== activeSensitiveRecord?.id);
          else clearSensitiveRecord();
          if (!records.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = sensitiveOffset ? '本页没有记录，请返回上一页。' : '没有敏感隔离记录。'; sensitiveList.prepend(empty); }
        }

        function clearSensitiveRecord(invalidateSelection = true) {
          if (invalidateSelection) ++sensitiveSelectionGeneration;
          activeSensitiveRecord = null;
          sensitiveDetail.querySelector('#sensitive-title').textContent = '请选择隔离记录';
          sensitiveDetail.querySelector('#sensitive-summary').textContent = '';
          sensitiveDetail.querySelector('#sensitive-metadata').textContent = '';
          sensitiveDetail.querySelector('#sensitive-message').textContent = '';
          sensitiveDetail.querySelector('#sensitive-acknowledge').disabled = true;
          sensitiveDetail.querySelector('#sensitive-discard').disabled = true;
        }

        function showSensitiveRecord(record, invalidateSelection = true) {
          if (invalidateSelection) ++sensitiveSelectionGeneration;
          activeSensitiveRecord = record;
          const open = !record.resolved_at;
          sensitiveDetail.querySelector('#sensitive-title').textContent = `${display(record.disposition)} · ${display(open ? 'unresolved' : record.resolution)}`;
          sensitiveDetail.querySelector('#sensitive-summary').textContent = displaySensitiveSummary(record.summary);
          sensitiveDetail.querySelector('#sensitive-metadata').textContent = `${record.categories.join(', ')} · 创建于 ${record.created_at}${record.resolved_at ? ` · 处理于 ${record.resolved_at}` : ''}`;
          sensitiveDetail.querySelector('#sensitive-message').textContent = open ? '' : `处理结果：${display(record.resolution)}`;
          sensitiveDetail.querySelector('#sensitive-acknowledge').disabled = !open;
          sensitiveDetail.querySelector('#sensitive-discard').disabled = !open;
        }

        async function resolveSensitiveRecord(resolution) {
          if (!activeSensitiveRecord || activeSensitiveRecord.resolved_at) return;
          const recordId = activeSensitiveRecord.id;
          const selectionGeneration = sensitiveSelectionGeneration;
          if (resolution === 'discard' && !await confirmAction('确认丢弃敏感记录', `丢弃隔离记录 ${recordId} 后无法恢复。`)) return;
          const contextIsCurrent = () => activeSensitiveRecord?.id === recordId && sensitiveSelectionGeneration === selectionGeneration;
          if (!contextIsCurrent()) return;
          const button = sensitiveDetail.querySelector(resolution === 'acknowledge' ? '#sensitive-acknowledge' : '#sensitive-discard');
          await performOnce(`sensitive-${recordId}`, button, '正在处理...', async () => {
          const response = await request(`/api/v1/sensitive-quarantine/${recordId}/resolve`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({resolution})});
          const message = sensitiveDetail.querySelector('#sensitive-message');
          if (!contextIsCurrent()) return;
          if (!response.ok) { const failure = await response.json(); if (contextIsCurrent()) setMessage(message, describeError(failure, '敏感记录处理失败'), 'error'); return; }
          const resolvedRecord = await response.json();
          if (!contextIsCurrent()) return;
          activeSensitiveRecord = resolvedRecord;
          showSensitiveRecord(resolvedRecord, false);
          button.dataset.keepDisabled = 'true';
          await refreshSensitiveQuarantine(recordId, {recordId, selectionGeneration});
          if (contextIsCurrent()) setMessage(message, resolution === 'acknowledge' ? '已知悉此敏感记录。' : '敏感记录已丢弃。', 'success');
          }, null, contextIsCurrent);
        }

        async function refreshDocuments() {
          const selectedLibrary = editorLibrary.value;
          const requestContext = editorContext.selectLibrary(selectedLibrary);
          invalidateForgottenSelection(selectedLibrary ? '正在加载遗忘记忆...' : '请先选择记忆库。');
          clearReconciliation();
          reconciliationList.innerHTML = selectedLibrary ? '<p class="empty">正在加载带外变更...</p>' : '<p class="empty">请先选择记忆库。</p>';
          documentTree.replaceChildren();
          historyDocument.replaceChildren();
          history.replaceChildren();
          restoreAction.replaceChildren();
          historySelection.clear();
          historyDiff.textContent = '';
          activeDocument = null;
          deletionPreviewVersion = null;
          deletionPreviewToken = null;
          editor.querySelector('#document-path').textContent = '请从文档列表选择内容';
          editor.querySelector('#document-source').value = '';
          editor.querySelector('#document-source').disabled = true;
          editor.querySelector('#preview-change').disabled = true;
          editor.querySelector('#save-change').disabled = true;
          editor.querySelector('#preview-delete').disabled = true;
          editor.querySelector('#confirm-delete').disabled = true;
          editor.querySelector('#editor-message').textContent = selectedLibrary ? '正在加载文档...' : '请先选择记忆库。';
          setMessage(historyMessage, selectedLibrary ? '正在加载文档列表...' : '请先选择记忆库。');
          if (!selectedLibrary) return;
          const response = await request(`/api/v1/libraries/${selectedLibrary}/documents`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) { if (editorContext.isCurrent(requestContext)) setMessage(editor.querySelector('#editor-message'), '文档列表加载失败，请重试。', 'error'); return; }
          if (!editorContext.isCurrent(requestContext)) return;
          const documents = await response.json();
          const placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = documents.length ? '请选择要恢复的文档' : '此记忆库还没有文档';
          historyDocument.append(placeholder);
          for (const item of documents) {
            if (!editorContext.isCurrent(requestContext)) return;
            const button = documentTree.appendChild(document.createElement('button'));
            button.type = 'button';
            button.textContent = item.path;
            button.addEventListener('click', () => loadDocument(item.path));
            const option = document.createElement('option');
            option.value = item.path;
            option.textContent = item.path;
            historyDocument.append(option);
          }
          if (!documents.length) documentTree.innerHTML = '<p class="empty">此记忆库还没有文档。</p>';
          setMessage(editor.querySelector('#editor-message'), documents.length ? '请选择文档进行查看或编辑。' : '此记忆库还没有文档。');
          setMessage(historyMessage, documents.length ? '请选择文档，再查看可恢复的提交。' : '此记忆库还没有文档。');
          await refreshHistory();
          await refreshForgotten();
          await refreshReconciliation();
        }

        async function loadDocument(path) {
          restoreAction.replaceChildren();
          historySelection.clear();
          const selectedLibrary = editorLibrary.value;
          const requestContext = editorContext.requestDocument(selectedLibrary, path);
          setMessage(editor.querySelector('#editor-message'), `正在加载 ${path}...`);
          const response = await request(`/api/v1/libraries/${selectedLibrary}/document?path=${encodeURIComponent(path)}`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) { if (editorContext.isCurrent(requestContext)) setMessage(editor.querySelector('#editor-message'), `文档加载失败：${path}`, 'error'); return null; }
          const loaded = await response.json();
          const accepted = editorContext.acceptDocument(requestContext, loaded);
          if (!accepted || selectedLibrary !== editorLibrary.value || accepted.libraryId !== selectedLibrary || accepted.path !== path) return null;
          activeDocument = loaded;
          historyDocument.value = activeDocument.path;
          editor.querySelector('#document-path').textContent = activeDocument.path;
          editor.querySelector('#document-source').value = activeDocument.content;
          editor.querySelector('#document-source').disabled = false;
          editor.querySelector('#preview-change').disabled = false;
          editor.querySelector('#save-change').disabled = false;
          editor.querySelector('#preview-delete').disabled = false;
          editor.querySelector('#confirm-delete').disabled = true;
          deletionPreviewVersion = null;
          deletionPreviewToken = null;
          showEditorPanel('source');
          setMessage(editor.querySelector('#editor-message'), '文档已加载。', 'success');
          setMessage(historyMessage, `已选择 ${activeDocument.path}。`, 'success');
          await refreshHistory();
          return documentContextIsCurrent(accepted) ? accepted : null;
        }

        function showEditorPanel(panel) {
          editor.querySelector('#document-source').hidden = panel !== 'source';
          editor.querySelector('#document-preview').hidden = panel !== 'preview';
          editor.querySelector('#document-diff').hidden = panel !== 'diff';
          for (const name of ['source', 'preview', 'diff']) {
            const tab = editor.querySelector(`#${name}-tab`);
            const selected = name === panel;
            tab.setAttribute('aria-selected', String(selected));
            tab.tabIndex = selected ? 0 : -1;
          }
        }

        async function previewChange(context = editorContext.snapshot(), panel = 'diff') {
          if (!context || !context.path || !context.sourceVersion) return false;
          const button = editor.querySelector('#preview-change');
          if (pending.has(`preview-${context.token}`)) return false;
          pending.add(`preview-${context.token}`); setBusy(button, true, '正在预览...');
          const previewRequest = PamHistory.previewRequest(context);
          let response;
          try { response = await request(previewRequest.url, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(previewRequest.body)}); }
          finally { pending.delete(`preview-${context.token}`); setBusy(button, false, '正在预览...'); }
          const message = editor.querySelector('#editor-message');
          if (!editorContext.isCurrent(context)) return false;
          if (!response.ok) { const failure = await response.json(); if (!editorContext.isCurrent(context)) return false; setMessage(message, describeError(failure, '变更预览失败'), 'error'); return false; }
          const preview = await response.json();
          if (!editorContext.isCurrent(context)) return false;
          editor.querySelector('#document-preview').srcdoc = preview.rendered_html;
          editor.querySelector('#document-diff').textContent = preview.diff || '没有变更。';
          setMessage(message, '预览已更新。', 'success');
          showEditorPanel(panel);
          return true;
        }

        async function loadHistoryDiff(selectedLibrary, entry, actionContext) {
          const pendingKey = `history-diff-${selectedLibrary}-${entry.commit}-${actionContext.token}`;
          if (pending.has(pendingKey)) return false;
          const selectionGeneration = ++generations.historyDiff;
          pending.add(pendingKey);
          historyDiff.textContent = '正在加载提交差异...';
          restoreAction.replaceChildren();
          historySelection.clear();
          setMessage(historyMessage, `正在加载提交 ${entry.commit.slice(0, 12)} 的差异...`);
          let diffResponse;
          try { diffResponse = await request(`/api/v1/libraries/${selectedLibrary}/history/${entry.commit}/diff`, {headers: {Authorization: `Bearer ${key}`}}); }
          finally { pending.delete(pendingKey); }
          if (!editorContext.isCurrent(actionContext) || selectionGeneration !== generations.historyDiff) return;
          if (!diffResponse.ok) {
            historyDiff.textContent = '提交差异加载失败。';
            setMessage(historyMessage, '提交差异加载失败，请重试。', 'error');
            const retry = document.createElement('button');
            retry.type = 'button';
            retry.textContent = '重试加载差异';
            retry.addEventListener('click', () => loadHistoryDiff(selectedLibrary, entry, actionContext));
            restoreAction.append(retry);
            return;
          }
          const diffPayload = await diffResponse.json();
          if (!editorContext.isCurrent(actionContext) || selectionGeneration !== generations.historyDiff) return;
          historyDiff.textContent = diffPayload.diff || '该提交没有可显示的差异。';
          const selection = historySelection.select(selectedLibrary, {
            path: actionContext.path,
            source_version: actionContext.sourceVersion,
            token: actionContext.token,
          }, entry.commit);
          const restore = document.createElement('button');
          restore.type = 'button';
          restore.textContent = `从 ${selection.commit.slice(0, 12)} 恢复 ${selection.path}`;
          restore.addEventListener('click', () => restoreDocument(selection));
          restoreAction.append(restore);
          setMessage(historyMessage, `已加载提交 ${selection.commit.slice(0, 12)} 的差异。`, 'success');
        }

        async function refreshHistory() {
          const context = editorContext.snapshot();
          const generation = ++generations.history;
          ++generations.historyDiff;
          history.replaceChildren();
          if (!context || !context.libraryId) return;
          history.innerHTML = '<p class="empty">正在加载本地历史...</p>';
          const selectedLibrary = context.libraryId;
          const response = await request(`/api/v1/libraries/${selectedLibrary}/history`, {headers: {Authorization: `Bearer ${key}`}});
          if (!response.ok) { if (editorContext.isCurrent(context)) history.innerHTML = '<p class="empty error">本地历史加载失败，请重试。</p>'; return; }
          if (!editorContext.isCurrent(context) || generation !== generations.history) return;
          const entries = await response.json(); history.replaceChildren();
          for (const entry of entries) {
            if (!editorContext.isCurrent(context)) return;
            const button = history.appendChild(document.createElement('button'));
            button.type = 'button';
            button.textContent = `${entry.commit.slice(0, 12)}  ${entry.subject}`;
            button.className = 'secondary';
            button.title = `${entry.authored_at} · ${entry.actor_type || '平台'} · ${entry.source || '初始化'}`;
            button.addEventListener('click', async () => {
              const actionContext = editorContext.snapshot();
              if (!actionContext || !actionContext.path) { setMessage(historyMessage, '请先选择要恢复的文档。', 'error'); return; }
              await loadHistoryDiff(selectedLibrary, entry, actionContext);
            });
          }
          if (!entries.length) history.innerHTML = '<p class="empty">还没有本地历史提交。</p>';
        }

        async function restoreDocument(selection) {
          const context = editorContext.snapshot();
          const selectionIsCurrent = () => documentContextIsCurrent(context)
            && context.libraryId === selection.libraryId
            && context.path === selection.path
            && context.token === selection.contextToken;
          if (!selectionIsCurrent()) return;
          if (!await confirmAction('确认恢复历史版本', `将从提交 ${selection.commit.slice(0, 12)} 恢复 ${selection.path}，并创建新的记忆变更事务。`)) return;
          if (!selectionIsCurrent()) return;
          const restoreButton = restoreAction.querySelector('button');
          await performOnce(`history-${selection.contextToken}`, restoreButton, '正在恢复...', async () => {
          const restore = PamHistory.request(selection, crypto.randomUUID());
          const response = await request(restore.url, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(restore.body)});
          if (!selectionIsCurrent()) return;
          if (!response.ok) { const failure = await response.json(); if (!selectionIsCurrent()) return; setMessage(historyMessage, describeError(failure, '历史版本恢复失败'), 'error'); return; }
          restoreAction.replaceChildren();
          historySelection.clear();
          if (!selectionIsCurrent()) return;
          const loadedContext = await loadDocument(selection.path);
          if (loadedContext && documentContextIsCurrent(loadedContext) && loadedContext.libraryId === selection.libraryId && loadedContext.path === selection.path) setMessage(historyMessage, `已从 ${selection.commit.slice(0, 12)} 恢复 ${selection.path}。`, 'success');
          }, null, selectionIsCurrent);
        }

        async function previewForgetting() {
          const context = editorContext.snapshot();
          if (!context || !context.path || !context.sourceVersion) return;
          const pendingKey = `forget-preview-${context.token}`;
          if (pending.has(pendingKey)) return false;
          const requestGeneration = ++generations.forgettingPreview;
          const button = editor.querySelector('#preview-delete');
          pending.add(pendingKey); setBusy(button, true, '正在预览...');
          let response;
          try { response = await request(`/api/v1/libraries/${context.libraryId}/document/delete-preview`, {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({path: context.path, expected_source_version: context.sourceVersion, operation_id: crypto.randomUUID()})}); }
          finally { pending.delete(pendingKey); setBusy(button, false, '正在预览...'); }
          if (!documentContextIsCurrent(context) || requestGeneration !== generations.forgettingPreview) return false;
          const message = editor.querySelector('#editor-message');
          if (!response.ok) { const failure = await response.json(); if (documentContextIsCurrent(context) && requestGeneration === generations.forgettingPreview) setMessage(message, describeError(failure, '遗忘影响预览失败'), 'error'); return false; }
          const preview = await response.json();
          if (!documentContextIsCurrent(context) || requestGeneration !== generations.forgettingPreview) return false;
          editor.querySelector('#document-diff').textContent = JSON.stringify(preview, null, 2);
          showEditorPanel('diff');
          deletionPreviewVersion = context.sourceVersion;
          deletionPreviewToken = preview.preview_token;
          editor.querySelector('#confirm-delete').disabled = false;
          setMessage(message, '请检查所有受影响的权威来源和派生数据，再确认遗忘。');
          return true;
        }

        async function forgetDocument() {
          const context = editorContext.snapshot();
          if (!context || deletionPreviewVersion !== context.sourceVersion || !deletionPreviewToken) return;
          if (!await confirmAction('强化确认：遗忘记忆', `此操作会遗忘 ${context.path} 并清理关联派生数据。`, context.path)) return;
          if (!editorContext.isCurrent(context)) return;
          const button = editor.querySelector('#confirm-delete');
          await performOnce(`forget-${context.token}`, button, '正在遗忘...', async () => {
          const response = await request(`/api/v1/libraries/${context.libraryId}/document`, {method: 'DELETE', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({path: context.path, expected_source_version: context.sourceVersion, preview_token: deletionPreviewToken, operation_id: crypto.randomUUID(), actor_type: 'user', source: 'web-delete'})});
          const message = editor.querySelector('#editor-message');
          if (!editorContext.isCurrent(context)) return;
          if (!response.ok) { const failure = await response.json(); if (editorContext.isCurrent(context)) setMessage(message, describeError(failure, '记忆遗忘失败'), 'error'); return; }
          await refreshDocuments();
          const currentContext = editorContext.snapshot();
          if (editorLibrary.value === context.libraryId && currentContext?.libraryId === context.libraryId && !currentContext.path) setMessage(message, '记忆已遗忘。', 'success');
          }, null, () => documentContextIsCurrent(context));
        }

        async function saveDocument() {
          const context = editorContext.snapshot();
          if (!context) return;
          const button = editor.querySelector('#save-change');
          await performOnce(`save-${context.token}`, button, '正在保存...', async () => {
            if (!(await previewChange(context)) || !documentContextIsCurrent(context)) return;
            const saveRequest = PamHistory.saveRequest(context, crypto.randomUUID());
            const response = await request(saveRequest.url, {method: 'PUT', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify(saveRequest.body)});
            const message = editor.querySelector('#editor-message');
            if (!documentContextIsCurrent(context)) return;
            if (!response.ok) { const failure = await response.json(); if (!documentContextIsCurrent(context)) return; setMessage(message, describeError(failure, '文档保存失败'), 'error'); return; }
            const loadedContext = await loadDocument(context.path);
            if (loadedContext && documentContextIsCurrent(loadedContext) && loadedContext.libraryId === context.libraryId && loadedContext.path === context.path) setMessage(message, '文档已保存。', 'success');
          }, null, () => documentContextIsCurrent(context));
          const current = editorContext.snapshot();
          button.disabled = !documentContextIsCurrent(current);
        }

        function invalidateForgottenSelection(messageText = '') {
          ++generations.forgotten;
          const memorySelect = forgottenForm.querySelector('#forgotten-memory');
          const commitSelect = forgottenForm.querySelector('#forgotten-commit');
          memorySelect.replaceChildren();
          commitSelect.replaceChildren();
          delete memorySelect.dataset.libraryId;
          delete memorySelect.dataset.generation;
          delete commitSelect.dataset.libraryId;
          delete commitSelect.dataset.generation;
          forgottenForm.querySelector('button[type="submit"]').disabled = true;
          setMessage(forgottenForm.querySelector('#forgotten-message'), messageText);
        }

        async function refreshForgotten() {
          const generation = ++generations.forgotten;
          const libraryId = editorLibrary.value;
          const memorySelect = forgottenForm.querySelector('#forgotten-memory');
          const commitSelect = forgottenForm.querySelector('#forgotten-commit');
          memorySelect.replaceChildren();
          commitSelect.replaceChildren();
          const submitButton = forgottenForm.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          if (!libraryId) return;
          const contextIsCurrent = () => generation === generations.forgotten && libraryId === editorLibrary.value;
          const [forgottenResponse, historyResponse] = await Promise.all([
            request(`/api/v1/libraries/${libraryId}/forgotten`, {headers: {Authorization: `Bearer ${key}`}}),
            request(`/api/v1/libraries/${libraryId}/history`, {headers: {Authorization: `Bearer ${key}`}}),
          ]);
          if (!contextIsCurrent()) return;
          if (!forgottenResponse.ok || !historyResponse.ok) { if (contextIsCurrent()) setMessage(forgottenForm.querySelector('#forgotten-message'), '遗忘记忆列表加载失败，请重试。', 'error'); return; }
          const [forgottenItems, historyEntries] = await Promise.all([forgottenResponse.json(), historyResponse.json()]);
          if (!contextIsCurrent()) return;
          for (const item of forgottenItems) {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = `${item.path} · 遗忘于 ${item.deleted_at}`;
            memorySelect.append(option);
          }
          for (const entry of historyEntries) {
            const option = document.createElement('option');
            option.value = entry.commit;
            option.textContent = `${entry.commit.slice(0, 12)} · ${entry.subject}`;
            commitSelect.append(option);
          }
          if (!contextIsCurrent()) { memorySelect.replaceChildren(); commitSelect.replaceChildren(); return; }
          memorySelect.dataset.libraryId = libraryId;
          memorySelect.dataset.generation = String(generation);
          commitSelect.dataset.libraryId = libraryId;
          commitSelect.dataset.generation = String(generation);
          submitButton.disabled = !memorySelect.value || !commitSelect.value;
        }

        async function refreshBindings() {
          const generation = ++generations.bindings;
          const response = await request('/api/v1/project-bindings', {headers: {Authorization: `Bearer ${key}`}});
          if (generation !== generations.bindings) return;
          if (!response.ok) { bindingTable.querySelector('tbody').innerHTML = '<tr><td colspan="6" class="empty error">项目绑定加载失败，请重试。</td></tr>'; return; }
          const bindings = await response.json();
          if (generation !== generations.bindings) return;
          projectBindings = bindings;
          const directBindings = projectBindings.filter((binding) => binding.kind === 'project');
          fillSelect(worktreeForm.querySelector('#main-binding'), directBindings, (binding) => binding.id, (binding) => `${binding.canonical_root} (${binding.id})`);
          const body = bindingTable.querySelector('tbody');
          body.replaceChildren();
          for (const binding of projectBindings) {
            const row = document.createElement('tr');
            const values = [binding.project_id, display(binding.kind), binding.canonical_root, binding.library_id, binding.availability];
            for (const [index, value] of values.entries()) {
              const cell = document.createElement('td');
              if (index === 4) cell.append(createStatusBadge(value));
              else cell.textContent = value;
              if (value === binding.canonical_root) cell.className = 'path';
              row.append(cell);
            }
            const actions = document.createElement('td');
            if (binding.kind === 'project') {
              const librarySelect = document.createElement('select');
              fillSelect(librarySelect, projectLibraries, (library) => library.id, (library) => library.canonical_path);
              librarySelect.value = binding.library_id;
              librarySelect.setAttribute('aria-label', `${binding.canonical_root} 的记忆库`);
              librarySelect.addEventListener('change', () => queueBindingUpdate(binding.id, librarySelect));
              actions.append(librarySelect);
            }
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'danger';
            remove.textContent = binding.kind === 'project' ? '解绑' : '移除关联';
            remove.addEventListener('click', async () => {
              if (!await confirmAction(binding.kind === 'project' ? '确认解绑项目' : '确认移除 Worktree 关联', `将移除 ${binding.canonical_root} 的当前关系。`)) return;
              await performOnce(`binding-${binding.id}`, remove, '正在移除...', async () => {
                const response = await request(`/api/v1/project-bindings/${binding.id}`, {method: 'DELETE', headers: {Authorization: `Bearer ${key}`}});
                setMessage(bindingForm.querySelector('#binding-message'), response.ok ? '项目关系已移除。' : '项目关系移除失败。', response.ok ? 'success' : 'error');
                if (response.ok) await refreshBindings();
              });
            });
            actions.append(remove);
            row.append(actions);
            body.append(row);
          }
          if (!projectBindings.length) body.innerHTML = '<tr><td colspan="6" class="empty">还没有项目绑定或 Worktree 关联。</td></tr>';
        }

        async function queueBindingUpdate(bindingId, select) {
          let state = bindingIntents.get(bindingId);
          if (!state) {
            state = {desiredLibraryId: select.value, running: false, select};
            bindingIntents.set(bindingId, state);
          }
          state.desiredLibraryId = select.value;
          state.select = select;
          select.disabled = true;
          if (state.running) return;
          state.running = true;
          const message = bindingForm.querySelector('#binding-message');
          try {
            while (true) {
              const libraryId = state.desiredLibraryId;
              const response = await request(`/api/v1/project-bindings/${bindingId}`, {method: 'PUT', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({library_id: libraryId})});
              if (libraryId !== state.desiredLibraryId) continue;
              if (!response.ok) {
                const failure = await response.json();
                setMessage(message, describeError(failure, '项目记忆库更新失败'), 'error');
                break;
              }
              setMessage(message, '项目记忆库已更新。', 'success');
              await refreshBindings();
              if (libraryId !== state.desiredLibraryId) continue;
              break;
            }
          } finally {
            state.running = false;
            state.select.disabled = false;
            bindingIntents.delete(bindingId);
          }
        }

          setMessage(message, '项目已绑定。', 'success');

        searchForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const button = searchForm.querySelector('button[type="submit"]');
          const requestId = crypto.randomUUID(); searchForm.dataset.requestId = requestId;
          await performOnce('search', button, '正在检索...', async () => {
          setMessage(searchForm.querySelector('#search-message'), '正在检索记忆...');
          const response = await request('/api/v1/search', {method: 'POST', headers: {Authorization: `Bearer ${key}`, 'Content-Type': 'application/json'}, body: JSON.stringify({cwd: searchForm.querySelector('#search-cwd').value, query: searchForm.querySelector('#search-query').value})});
          if (searchForm.dataset.requestId !== requestId) return;
          const message = searchForm.querySelector('#search-message');
          const results = searchForm.querySelector('#search-results');
          results.replaceChildren();
          if (!response.ok) { const failure = await response.json(); setMessage(message, describeError(failure, '记忆检索失败'), 'error'); return; }
          const payload = await response.json();

            const content = document.createElement('pre');
